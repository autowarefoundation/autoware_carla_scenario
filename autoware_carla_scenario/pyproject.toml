[project]
name = "autoware-carla-scenario"
version = "18.11.2"
description = "CARLA scenario testing framework for Autoware"
readme = "README.md"
license = "Apache-2.0"
# A copy of the repository's LICENSE: license files have to live inside the
# package directory to reach the sdist and wheel.
license-files = ["LICENSE"]
authors = [
    { name = "Masaya Kataoka", email = "ms.kataoka@gmail.com" }
]
# The interpreters CI tests: every CPython line upstream still supports, 3.10
# (Autoware's own environment, and ROS 2 Humble's) through 3.14. The CARLA
# client, typesafe_carla, carries its CPython package prebuilt for any Python
# 3.10+, and every other dependency ships wheels for the whole range. Raise the
# ceiling together with CI's interpreter matrix and
# `authoring.wheelhouse.TESTED_PYTHONS` (a test checks the three agree).
requires-python = ">=3.10,<3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # The CARLA client: `import typesafe_carla.carla as carla` at run time (its
    # CPython package, prebuilt in the wheel; docs/installation.md), and its
    # Codon library for the static check (typecheck/). It pulls in
    # typesafe-carla-toolchain, the pinned Codon the check needs. Both ship for
    # Linux x86_64 and aarch64 (aarch64 from typesafe-carla 0.4.0 on).
    "typesafe-carla>=0.8.1,<0.9; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
    "pyxodr>=0.1.0",
    # Headless: the only OpenCV calls in this package are imencode and
    # pointPolygonTest -- there is no imshow/namedWindow anywhere, so the GUI
    # build would add ~125 MB of GTK/GStreamer libraries (and a libGL system
    # dependency) that nothing calls.
    "opencv-python-headless>=4.8",
    "numpy>=1.21",
    "pytest>=9.0.1",
    # The static check's None check (typecheck/none_check.py, #239): Codon
    # unwraps an Optional implicitly, so mypy's strict Optional reports a
    # value that may be None used where it may not be.
    "mypy>=1.19.0",
    "python-dotenv>=1.2.2",
    # `lanelet2` and `autoware_lanelet2_extension_python` are provided by
    # simple-lanelet2.
    "simple-lanelet2>=1.2.3",
    "tqdm>=4.67.1",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "jinja2>=3.1.0",
    # The Scenario Editor is driven entirely by HTML form posts, and Starlette
    # requires this to read a request body as a form -- urlencoded included.
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    # ASAM OpenODD: reading, judging, versioning and sampling ODDs, and coverage
    # -- collecting, merging, the COD export (a Rust core). This package is its
    # CARLA backend (odd/backend.py's CarlaBackend).
    "openodd-py>=0.13.0",
    # `authoring/wheelhouse.py` reads a scenario package's `requires-python`
    # to choose the interpreters its wheelhouse is built for.
    "packaging>=23.0",
    "tomli>=1.1.0; python_version < '3.11'",
    "pydantic>=2.0.0",
    # Speaks the alpasim `egodriver` gRPC contract to an external driver policy:
    # the contract (vendored protos, geometry, the policy-side server) is
    # hakuturu583/carla_driver_interface. A range, not a pin: a policy and a
    # scenario package share an environment whenever their majors agree. A policy
    # in another process may be on another major: the contract revision each side
    # declares on the wire (`carla_driver_interface.contract`) covers that.
    "carla-driver-interface>=2.3,<3",
    "grpcio>=1.60",
    # The vendored modules are protobuf 4.25 gencode, which every runtime from
    # 4.25 through 7.x loads. The 4.x runtime itself cannot load on Python 3.14,
    # so the range has to reach past it; the ceiling is the newest major tested.
    "protobuf>=4.25.0,<8",
    # Serialises the trajectory log (trajectory_recorder.py) on every tick: a
    # Rust JSON encoder, several times faster than the stdlib's, writing the
    # same floats byte for byte.
    "orjson>=3.13.0",
]

[project.urls]
Homepage = "https://github.com/autowarefoundation/autoware_carla_scenario"
Documentation = "https://autowarefoundation.github.io/autoware_carla_scenario/"
Repository = "https://github.com/autowarefoundation/autoware_carla_scenario"
Issues = "https://github.com/autowarefoundation/autoware_carla_scenario/issues"
Changelog = "https://github.com/autowarefoundation/autoware_carla_scenario/releases"

[project.optional-dependencies]
# The SUMO traffic backend (`traffic.backend=sumo`): SUMO itself (the
# simulator, netconvert and randomTrips), driven in-process through libsumo,
# and roadgen (hakuturu583/hdmap_generator), which converts the OpenDRIVE the
# CARLA world runs into the network netconvert builds -- with bicycles on the
# sidewalks both ways, changing between sidewalk and road and with every
# bicycle link traced to its light (`cycle_on_sidewalks`, 0.41.1).
sumo = [
    "eclipse-sumo>=1.23",
    "libsumo>=1.23",
    "sumolib>=1.23",
    "traci>=1.23",
    "roadgen>=0.41.1",
]
# Map files for a driver policy (`driver.map_dir`): roadgen converts the
# world's OpenDRIVE into Lanelet2 and friends, with the stop lines CARLA
# paints (0.33), each junction lanelet's `turn_direction` (0.34), the
# traffic-light regulatory elements on the lanelets through the junction
# with the stop line before them (0.35), and a stop sign's `traffic_sign`
# element (0.36), as Autoware's maps have them; the same version as the
# `sumo` extra's, so the two install together.
map = [
    "roadgen>=0.41.1",
]
# An ego driven by ROS 2 nodes over DDS (`ego.entity=ros2`, docs/ros2.md):
# Cyclone DDS's Python binding, which speaks to rmw_cyclonedds_cpp nodes with
# no ROS 2 installation. Its wheels cover Linux x86_64 on CPython 3.10-3.13
# only (11.0.1); elsewhere it would build from source against a Cyclone DDS C
# install, so the marker leaves it out there rather than fail the install.
ros2 = [
    "cyclonedds>=11.0.1; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version < '3.14'",
]
# A Rerun recording of each run (`rerun.enabled=true`, docs/usage.md): the
# converter from trajectory logs to `.rrd` (hakuturu583/autoware_carla_scenario_rerun,
# a Rust core in one abi3 wheel), which the runner hands each log to as the run
# ends. Its minor version follows the trajectory log's format.
rerun = [
    "autoware-carla-scenario-rerun>=0.1,<0.2",
]
# The LiDAR sweeps of each run as a Rerun recording too (`rerun.lidar=true`):
# the converter, and the Rerun SDK of the minor version its recordings are
# written with, which writes the sweeps.
rerun-lidar = [
    "autoware-carla-scenario-rerun>=0.1,<0.2",
    "rerun-sdk>=0.38.1,<0.39",
]
# A T4 dataset of each run (`t4.enabled=true`, docs/t4_dataset.md): the
# writer (hakuturu583/autoware_carla_scenario_t4, a Rust core in one abi3
# wheel), which the runner hands the ego's poses, the boxes of the road
# users and the sweeps and frames of the driver policy's sensors.
t4 = [
    "autoware-carla-scenario-t4>=0.1,<0.2",
]
# The Rerun viewer the recordings are opened with (`rerun X.rrd`): the
# converter's own `viewer` extra, which pins the Rerun minor version its
# recordings are written with.
viewer = [
    "autoware-carla-scenario-rerun[viewer]>=0.1,<0.2",
]

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# `hydra_plugins` is a PEP 420 namespace package shared with Hydra itself, so
# each plugin has to be named individually and `namespace` has to be set --
# otherwise the backend looks for a single top-level module named after the
# distribution and the plugins never reach the wheel.
namespace = true
module-name = [
    "autoware_carla_scenario",
    "hydra_plugins.autoware_scenario_searchpath",
    "hydra_plugins.autoware_scenario_sweeper",
]

[project.scripts]
scenario = "autoware_carla_scenario.examples.run:main"
scenario-expand = "autoware_carla_scenario.examples.expand:main"
# Compile scenarios with Codon (the static check the runner makes before a run).
scenario-check = "autoware_carla_scenario.typecheck.cli:main"
# Merge the coverage files of scenario runs into an ODD/scenario coverage report.
scenario-coverage = "autoware_carla_scenario.coverage.report:main"
# Follow, collect, resubmit or cancel a batch run with launcher=slurm.
scenario-slurm = "autoware_carla_scenario.slurm.cli:main"
# Check an ODD (Python with Codon, or OpenODD YAML) and show its buckets.
scenario-odd = "autoware_carla_scenario.odd.cli:main"
scenario-new = "autoware_carla_scenario.scaffold.generator:main"
# Download a CARLA server (the nightly build by default) for the runner to launch.
scenario-setup = "autoware_carla_scenario.carla_install:main"
detect-no-3d-model = "autoware_carla_scenario.tools.detect_no_3d_model_lanelets:main"
viewer = "autoware_carla_scenario.ui:main"
# The editor is a separate application from the viewer; running one does not
# start the other.
scenario-editor = "autoware_carla_scenario.editor:main"
