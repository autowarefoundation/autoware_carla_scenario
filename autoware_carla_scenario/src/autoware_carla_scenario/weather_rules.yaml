# The rules the weather's effects follow: a Bayesian network of conditional
# distributions, which openodd reads (its docs/rules.md, version 3), from the
# conditions a run is given to what they do (docs/odd.md, "Weather rules").
#
# * The causes are the inputs: concepts of the taxonomy (`taxonomy:`), the
#   vocabulary an ODD is written in -- the rainfall rate, the visibility
#   through the fog, the time of day, the wind speed, the cloudiness.  A run
#   gives them in its `environment` config (`rainfall_rate_mm_h`,
#   `fog_visibility_range_m`, `time_of_day`, `wind_speed_kmh`, `cloud_cover`).
# * The effects are the quantities: CARLA's own weather settings
#   (`carla_*`), which render the conditions, and what the conditions do to
#   the road and the drivers -- the grip, how far drivers see, the speed they
#   keep.  None of them is in the taxonomy.
#
# Before a run starts, every effect the run does not set itself is worked out
# once, at a quantile (the median unless the run draws one): the sampler does
# it for the cases it draws, the runner for a config that names the causes
# (`weather_rules.resolve_environment`).  What the run then applies are
# numbers.  The grip alone is worked out again for each vehicle where the
# rules differ by vehicle, from the CARLA water already set.
#
# Each quantity is one or more parts; each part reads some causes or other
# quantities (`at`, with the points it is written at) and gives a
# distribution (`uniform`, from `low` to `high`, or `triangular`) at each
# point, interpolated linearly between number points and held beyond them; a
# categorical cause is written at its labels.  With more than one part, every
# part gives its value at the run's quantile and `combine` (`min` or `max`)
# joins them.
#
# A run reads another file with `environment.rules` in its config, merged
# over these: it names only what it changes, may `extends` other files (by
# path, https:// URL or git source), and may differ by vehicle.
version: 3
taxonomy: {bundled: default}
basis:
  kind: expert
  by: autoware_carla_scenario
  text: >-
    Set from CARLA's own weather presets and published ranges of tyre-road
    friction and visibility; not fitted to measured runs.

inputs:
  rainfall_rate:
    concept: environment_conditions.environment_conditions.weather.rain.rainfall_rate
    unit: mm/h
    default: 0
    text: The rainfall rate the run is set to.
  fog_visibility_range:
    concept: environment_conditions.environment_conditions.weather.fog.fog_visibility_range
    unit: m
    default: 10000
    text: How far one sees through the fog, as meteorology measures it; 10 km is no fog.
  time_of_day:
    concept: environment_conditions.environment_conditions.illumination.time_of_day
    default: day
    text: The time of day the run is set to.
  wind_speed:
    concept: environment_conditions.environment_conditions.weather.wind.wind_speed
    unit: km/h
    default: 0
    text: The wind speed the run is set to.
  cloudiness:
    concept: environment_conditions.environment_conditions.illumination.cloudiness
    default: clear
    text: How cloudy the sky is.

quantities:
  # CARLA's precipitation, 0-100, for a rainfall rate, mm/h: the taxonomy's
  # light rain (0.1-2.5 mm/h) up to about 30, moderate (2.5-7.6) up to about
  # 70, heavy above.
  carla_precipitation:
    parts:
      rain:
        at: {rainfall_rate: [0, 0.1, 2.5, 7.6, 25]}
        uniform:
          low:  [0, 1, 25, 60, 95]
          high: [0, 10, 35, 75, 100]

  # CARLA's cloudiness, 0-100: the sky the run is set to, and at least what
  # CARLA's rain presets pair with its precipitation (SoftRain, MidRainy,
  # HardRain; LibCarla's WeatherParameters.cpp) -- precipitation alone barely
  # shows in a camera image, a few drops on a dry road under a clear sky.  The
  # cloudier of the two holds (`combine: max`): rain clouds the sky, and a sky
  # may be cloudy without rain.  The cloudiness bands are what the
  # `cloud_cover` probe reads back when the run names no cloud cover: clear
  # below 20, overcast from 70.  A run that names one is measured as it, the
  # sky's, whatever the rain adds here.
  carla_cloudiness:
    combine: max
    parts:
      sky:
        at: {cloudiness: [clear, partly_cloudy, overcast]}
        uniform:
          low:  [0, 20, 70]
          high: [19.99, 69.99, 100]
      rain:
        at: {carla_precipitation: [0, 30, 60, 100]}
        uniform:
          low:  [0, 55, 75, 95]
          high: [5, 65, 85, 100]
  # The standing water and wetness CARLA's rain presets pair with its
  # precipitation.
  carla_precipitation_deposits:
    parts:
      rain:
        at: {carla_precipitation: [0, 30, 60, 100]}
        uniform:
          low:  [0, 45, 55, 85]
          high: [0, 55, 65, 95]
  carla_wetness:
    parts:
      rain:
        at: {carla_precipitation: [0, 30, 60, 100]}
        uniform:
          low:  [0, 25, 55, 95]
          high: [0, 35, 65, 100]

  # CARLA's wind intensity, 0-100, for the wind speed, km/h, in the levels
  # the `wind` probe reads back: the taxonomy's no wind (under 5 km/h) under
  # 1, light wind (5-20) 1-30, moderate (20-50) 30-70, strong (from 50) from
  # 70.  The band narrows to the level's edge at each bucket's edge and
  # widens inside it, so a speed in a bucket draws, at any quantile, an
  # intensity of that bucket's level.  50 km/h itself is strong, as in the
  # sampler's and the coverage's [50, inf] bucket.
  carla_wind_intensity:
    parts:
      wind:
        at: {wind_speed: [0, 5, 12.5, 20, 35, 50, 75, 100]}
        uniform:
          low:  [0, 1, 8, 30, 40, 70, 75, 90]
          high: [0, 1, 25, 30, 60, 70, 90, 100]

  # CARLA's fog density, 0-100, for the visibility through the fog, metres:
  # the taxonomy's thick fog (under 50 m) near 100, no detectable fog (over
  # 1600 m) near 0.
  carla_fog_density:
    parts:
      fog:
        at: {fog_visibility_range: [15, 50, 450, 800, 1600, 5000]}
        uniform:
          low:  [95, 85, 50, 30, 10, 0]
          high: [100, 95, 65, 45, 20, 0]

  # The sun, degrees, for the time of day: the day with the sun above the
  # horizon, dusk and dawn the civil twilight (down to 6 degrees below it),
  # the night under that.  Dusk and dawn are told apart by the sun's azimuth:
  # rising (0-180 degrees) at dawn, setting (180-360) at dusk -- what the
  # `time_of_day` probe reads back.
  carla_sun_altitude:
    parts:
      time:
        at: {time_of_day: [day, dusk, night, dawn]}
        uniform:
          low:  [0, -6, -90, -6]
          high: [90, -0.01, -6.01, -0.01]
  carla_sun_azimuth:
    parts:
      time:
        at: {time_of_day: [day, dusk, night, dawn]}
        uniform:
          low:  [0, 180, 0, 0]
          high: [360, 359.99, 360, 179.99]

  # The grip a tyre keeps on the road, as a share of CARLA's dry road's, by
  # how wet the road is: its wetness and its standing water, each a part, so
  # the wetter of the two holds.  Measured tyre-road friction coefficients
  # are about 0.8-1.0 on dry asphalt, 0.5-0.7 on wet and 0.3-0.5 under a
  # water film (what heavy rain leaves): a wet road keeps about three
  # quarters of the dry grip, a flooded one about half.  Each range spans
  # what tyres, their wear and the asphalt make of the same water; a dry
  # road's is centred on CARLA's own grip, so a dry run at its median drives
  # as it did before.
  tire_friction:
    combine: min
    parts:
      wetness:
        at: {carla_wetness: [0, 50, 100]}                 # dry, wet, flooded
        uniform:
          low:  [0.90, 0.65, 0.45]
          high: [1.10, 0.85, 0.65]
      standing_water:
        at: {carla_precipitation_deposits: [0, 50, 100]}
        uniform:
          low:  [0.90, 0.65, 0.45]
          high: [1.10, 0.85, 0.65]

  # How far a driver sees, metres.  The fog, the rain and the light each bound
  # it, and the shortest bound holds: fog at night is seen through no further
  # than either.  Each range spans what eyes, windscreens, headlights and the
  # road's own lighting make of the same conditions.
  visibility:
    combine: min
    parts:
      # A clear day's is what a driver looks ahead on an open road; in fog,
      # about what meteorology measures through it.
      fog:
        at: {fog_visibility_range: [15, 50, 150, 400, 1000]}
        uniform:
          low:  [12, 40, 120, 250, 250]
          high: [18, 60, 180, 400, 400]
      # Falling rain and the spray the traffic throws up shorten the view less
      # than fog does.
      rain:
        at: {rainfall_rate: [0, 2.5, 7.6, 25]}           # dry, light, heavy, torrential
        uniform:
          low:  [250, 180, 100, 60]
          high: [400, 320, 220, 150]
      # At night, what headlights light, from a dipped beam's 50 m to a main
      # beam's or a lit street's 150 m; in the twilight, between that and
      # the day's.
      light:
        at: {time_of_day: [day, dusk, night, dawn]}
        uniform:
          low:  [250, 150, 50, 150]
          high: [400, 275, 150, 275]

  # The speed a driver keeps, m/s, from how far they see: a part reading the
  # visibility above, so the rules chain (conditions -> visibility -> speed).
  # Written for SUMO's default car, braking at 4.5 m/s^2 a second after it
  # sees: `high` is the speed it stops from within the visibility (8 m/s in
  # 15 m, 26 m/s in 100 m; visibility.sight_speed), and most drivers keep a
  # little below it.  A vehicle that brakes or reacts otherwise scales it by
  # its own stopping speed (visibility.sight_speed_at), and each traffic
  # vehicle draws a quantile of its own.
  sight_speed:
    parts:
      sight:
        at: {visibility: [15, 30, 50, 100, 150, 250, 400]}
        triangular:
          low:  [6.0, 9.4, 12.9, 19.4, 24.4, 32.4, 41.8]
          mode: [7.6, 11.9, 16.3, 24.5, 30.9, 41.0, 52.9]
          high: [8.0, 12.5, 17.2, 25.8, 32.5, 43.1, 55.7]
