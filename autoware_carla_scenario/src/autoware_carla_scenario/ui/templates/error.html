{% extends "base.html" %}
{% block title %}{{ heading }} - Scenario Result Viewer{% endblock %}

{% block breadcrumb %}
<nav class="flex text-sm text-gray-500" aria-label="Breadcrumb">
  <ol class="flex items-center space-x-2">
    <li><a href="/" class="hover:text-blue-600">Sessions</a></li>
  </ol>
</nav>
{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto my-12 bg-white rounded-lg shadow p-8 text-center" id="error-page">
  <p class="text-sm font-mono text-gray-400">{{ status_code }}</p>
  <h1 class="mt-1 text-2xl font-bold text-gray-800">{{ heading }}</h1>
  <p class="mt-2 text-sm text-gray-600">{{ message }}</p>
  <a href="/" class="mt-6 inline-block px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm font-medium">Back to the sessions</a>
</div>
{% endblock %}
