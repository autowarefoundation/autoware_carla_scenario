# TrajectoryTimeSequenceRawOptimizer's parameters on the X2 (autoware_launch.x2
# feat/v4.4/e2e trajectory_time_sequence_raw_optimizer.param.yaml, 0f9e42f29c), as
# tier4/OnePlanner's closed-loop replay control chain reads them
# (projects/resworld/closed_loop_control_chain/params/tso-x2-0f9e42f29c.param.yaml).
# The default of driver.lateral.tso_param_file (driver/autoware_lateral.py).
/**:
  ros__parameters:
    time_sequence_raw_optimizer:
      weight_longitudinal: 0.1
      weight_lateral: 0.1
      weight_yaw: 1.0
      weight_jerk: 0.01
      weight_steering_rate: 1.0
      terminal_weight_scale: 1.0
      # Latch an extra terminal penalty once the predicted endpoint is within snap_distance_m
      # of the route goal. Weights are added on the terminal cost only.
      goal:
        snap_distance_m: 5.0
        weight_longitudinal: 100.0
        weight_lateral: 100.0
        weight_yaw: 1000.0
        weight_velocity: 0.2
        unlatch_horizon_s: 8.0
        unlatch_min_speed_mps: 3.0
      temporal_consistency:
        enable: true
        weight_longitudinal: 0.4
        weight_lateral: 2.0
        weight_yaw: 0.2
        weight_velocity: 0.01
        decay_time_constant_s: 1.0
        far_weight_ratio: 0.5
      min_velocity_mps: 0.0
      max_velocity_mps: 30.0
      min_acceleration_mps2: -4.0
      max_acceleration_mps2: 1.5
      min_jerk_mps3: -5.0
      max_jerk_mps3: 5.0
      max_steering_rate_rps: 5.0
      max_lateral_acceleration_mps2: 1.0
      max_sqp_iterations: 100
      publish_debug_topics: true
      # Seed OCP x0 from odom at DP/ML trajectory stamp, not latest 40 Hz pose.
      use_stamped_ego_state: true
      ego_state_buffer_duration_s: 1.0
      max_ego_stamp_mismatch_s: 0.15

      # Stopped Regime Parameters
      stopped_velocity_threshold_mps: 0.15
      stopped_trajectory_max_length_m: 1.5
      goal_steer_zero_enable: true
      goal_steer_zero_distance_m: 5.0
      goal_steer_zero_requires_stopped: true

    road_border_avoidance:
      enable: true
      footprint_margin_m: 0.4
      search_radius_m: 120.0
      shift_step_m: 0.05  # first 3 probes [m]; remaining clearance via bisection
      max_lateral_shift_m: 1.0
      propagate_shift: true
