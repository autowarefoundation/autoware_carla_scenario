# @package _global_
traffic:
  # SUMO, co-simulated on the world's own road network: the world's OpenDRIVE
  # is converted with roadgen (hakuturu583/hdmap_generator) and netconvert, and
  # SUMO steps once per CARLA tick.  Needs the `sumo` extra.  By default the
  # scenario's vehicles stay with the TrafficManager and its pedestrians with
  # CARLA, and like an Autoware ego they are published into SUMO so its traffic
  # reacts; SUMO adds no traffic of its own unless `ambient`, `pedestrians` or
  # `bicycles` asks for it.
  backend: sumo
  options:
    # traffic_manager: the scenario's NPCs (and an autopilot ego) are driven as
    # under the traffic_manager backend. sumo: SUMO drives them too.
    scenario_vehicles: traffic_manager
    # traffic_manager: the scenario's pedestrians walk on CARLA's side
    # (WalkStraightAction: a WalkerControl). sumo: each is a SUMO person its
    # walker follows, and WalkStraightAction walks it straight on through TraCI.
    scenario_pedestrians: traffic_manager
    # How CARLA's copies of SUMO's vehicles follow them. physics: CARLA's
    # vehicle physics, steered and driven along SUMO's trajectory. teleport:
    # placed where SUMO has them every tick.
    vehicle_control: physics
    # physics: a car this far off its SUMO vehicle moves the SUMO vehicle to it
    # (so SUMO keeps its gaps to the real car); 0 never does.
    feedback_distance_m: 0.0
    resync_distance_m: 8.0
    # Where the TrafficManager is, as for the traffic_manager backend.
    tm_port: ${oc.select:traffic_manager.port,null}
    # Put CARLA's pedestrians into SUMO as persons, so SUMO traffic yields to
    # them on the road as well as on crossings.
    publish_walkers: true
    # Build the network with pedestrian crossings and walking areas, so SUMO's
    # pedestrians cross roads on crossings; at a light, a crossing is green
    # while the traffic over its road is red.
    pedestrian_crossings: true
    # Let bicycles ride the sidewalks, both ways, as well as the carriageway
    # (roadgen's cycle_on_sidewalks): they change between sidewalk and road at
    # junctions and every 50 m between, and cross where a crossing is. At a
    # light, with traffic_light_authority: carla, a bicycle coming onto the
    # road goes with the traffic beside it. false: sidewalks are for walking.
    cycle_on_sidewalks: false
    # Lateral acceleration (m/s^2) SUMO traffic is held to in bends when the
    # map is converted (roadgen cuts edges at bends and slows each piece and
    # each junction turn); null converts the map as it is.
    curve_lateral_acceleration: 3.0
    # Sublane width, m (--lateral-resolution): SUMO's sublane model, where
    # vehicles change lanes smoothly at traffic.vehicles' max_lateral_speed_mps
    # and max_lateral_accel. null: SUMO's lane-based model.
    lateral_resolution_m: 0.4
    # With lateral_resolution_m: null only, how long a lane change takes, s
    # (--lanechange.duration); null: 3 s.
    lane_change_duration_s: null
    # SUMO's step, s (--step-length); null: the world's fixed_delta_seconds.
    # A shorter one must divide it in whole ms: SUMO steps that many times
    # per tick.
    step_length_s: null
    # carla: SUMO obeys CARLA's lights. sumo: CARLA's lights follow SUMO. none.
    traffic_light_authority: carla
    # SUMO's own randomTrips demand, independent of the scenario. Off: the
    # examples' background traffic is background_traffic (config.yaml), which
    # places it with lanelet constraints and can be ended by condition.
    ambient:
      enabled: false
      vehicles_per_hour: 900
    # SUMO's own pedestrians (randomTrips --pedestrians), mirrored into CARLA
    # as walkers within radius_m of the ego (null: mesoscopic's radii when
    # enabled, everywhere otherwise).
    pedestrians:
      enabled: false
      persons_per_hour: 600
      max_distance_m: 500.0
      radius_m: null
      max_persons: null
      blueprint: walker.pedestrian.0001
    # SUMO's own bicycles (randomTrips --vclass bicycle), mirrored into CARLA
    # as bicycles within radius_m of the ego (null: spawn_radius_m), at most
    # max_bicycles of them (apart from max_vehicles).
    bicycles:
      enabled: false
      bicycles_per_hour: 300
      min_distance_m: 0.0
      max_distance_m: 2000.0
      # How they ride, SUMO's default bicycle type redefined: each numeric
      # parameter is a spread, {mean, std}, every rider drawing its own value
      # (null: SUMO's bicycle default). traffic.vehicles does not apply to
      # bicycles.
      # Speed on a free road, m/s (SUMO: 5.56, 20 km/h).
      max_speed_mps: {mean: null, std: null}
      # Acceleration and braking, m/s^2 (SUMO: 1.2 and 3).
      accel: {mean: null, std: null}
      decel: {mean: null, std: null}
      # Gap kept to the one ahead when standing, m (SUMO: 0.5).
      min_gap_m: {mean: null, std: null}
      # Reaction time, s, and imperfection, 0-1 (SUMO: 1 and 0.5).
      reaction_time_s: {mean: null, std: null}
      imperfection: {mean: null, std: null}
      # Most lateral speed, m/s: how quickly a rider moves across the lane.
      max_lateral_speed_mps: {mean: null, std: null}
      # Ride on through a light red for less than this, s (null: stop at red).
      red_light_violation_s: {mean: null, std: null}
      radius_m: null
      max_bicycles: null
      # A mirrored bicycle is one of these; those the world lacks are left
      # out, and with none left bicycles ride in SUMO only.
      blueprints:
        - vehicle.bh.crossbike
        - vehicle.diamondback.century
        - vehicle.gazelle.omafiets
      # teleport: placed where SUMO has them every tick (a bicycle crossing
      # the kerb between sidewalk and road would trip CARLA's physics).
      # physics: as vehicle_control's.
      vehicle_control: teleport
    # SUMO seconds simulated before the scenario clock starts.
    warmup_s: 30.0
    # Mirror only the nearest SUMO vehicles into CARLA (null: all of them).
    spawn_radius_m: null
    max_vehicles: null
    # Simulate traffic far from what CARLA drives (the ego, and the scenario's
    # vehicles the TrafficManager drives) in a mesoscopic queue model, out of
    # SUMO and out of CARLA, and bring it back when it comes near.
    mesoscopic:
      enabled: false
      # Back into SUMO and CARLA this close; out further than meso_radius_m
      # (null: 1.25 x micro_radius_m).
      micro_radius_m: 200.0
      meso_radius_m: null
      update_interval_s: 1.0
      # Let the scenario's own vehicles SUMO drives leave CARLA too: such an
      # entity has no actor while it is far (entity.simulation_fidelity).
      scenario_vehicles: false
      headway_s: 1.5
      jam_spacing_m: 7.5
      junction_control: true
    blueprint: vehicle.lincoln.mkz
    # An existing .net.xml instead of converting the world's OpenDRIVE, and
    # extra demand beside the ambient traffic.
    net_path: null
    route_path: null
    # Record SUMO's floating car data to <output_dir>/sumo/fcd.xml.
    fcd_output: false
    use_libsumo: true
    binary: sumo
    sumo_args: []
  # How vehicles drive and pedestrians walk, in the terms every backend
  # shares (VehicleParameters / PedestrianParameters,
  # docs/traffic_backends.md). Each numeric parameter is a spread, {mean,
  # std}: every vehicle and every pedestrian draws its own value from a
  # normal distribution cut to the parameter's bounds (std null or 0: all the
  # same). An ODD can draw both (odd.traffic_probes). null: the backend's own
  # default. A field this backend does not support is an error naming the
  # backends that do.
  vehicles:
    # Desired speed as a multiple of the speed limit (traffic_manager, sumo).
    speed_factor: {mean: null, std: null}
    # Gap kept to the vehicle ahead when standing, m (traffic_manager, sumo).
    min_gap_m: {mean: null, std: null}
    # Change lanes of their own accord (traffic_manager, sumo).
    lane_changes: null
    # Probabilities (0-1) of ignoring lights, signs, vehicles and
    # walkers, and of a random lane change (traffic_manager only).
    ignore_lights: {mean: null, std: null}
    ignore_signs: {mean: null, std: null}
    ignore_vehicles: {mean: null, std: null}
    ignore_walkers: {mean: null, std: null}
    random_lane_changes: {mean: null, std: null}
    # Acceleration and braking, m/s^2, reaction time, s, and driver
    # imperfection, 0-1 (sumo only).
    accel: {mean: null, std: null}
    decel: {mean: null, std: null}
    reaction_time_s: {mean: null, std: null}
    imperfection: {mean: null, std: null}
    # Most lateral speed, m/s, and (with traffic.options.lateral_resolution_m,
    # SUMO's sublane model) most lateral acceleration, m/s^2 (sumo only).
    max_lateral_speed_mps: {mean: null, std: null}
    max_lateral_accel: {mean: null, std: null}
    # Hold the traffic to the speed it stops from within what its
    # drivers see in the run's weather (traffic_manager, sumo; on by
    # default for sumo, off unless true for traffic_manager).
    follow_visibility: null
  # SUMO's pedestrians (sumo only: the TrafficManager drives no pedestrians).
  pedestrians:
    # Walking speed, m/s.
    walking_speed_mps: {mean: null, std: null}
    # Gap kept to the person ahead, m.
    min_gap_m: {mean: null, std: null}
    # Walk onto a crossing whose light has been red for less than this, s.
    red_light_violation_s: {mean: null, std: null}
