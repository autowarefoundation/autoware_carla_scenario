# @package _global_
traffic:
  # CARLA's own TrafficManager: the default, and what every scenario written
  # before traffic backends existed is driven by.
  backend: traffic_manager
  options:
    # `traffic_manager.port` is where the port lived before this group existed,
    # and what exported scenario packages still set, so it keeps deciding --
    # `oc.select` so that a config composing this group without that one still
    # resolves, leaving the backend's own default in play.
    port: ${oc.select:traffic_manager.port,null}
  # How vehicles drive and pedestrians walk, in the terms every backend
  # shares (VehicleParameters / PedestrianParameters,
  # docs/traffic_backends.md). null: the backend's own default. A field this
  # backend does not support is an error naming the backends that do.
  vehicles:
    # Desired speed as a multiple of the speed limit (traffic_manager, sumo).
    speed_factor: null
    # Gap kept to the vehicle ahead when standing, m (traffic_manager, sumo).
    min_gap_m: null
    # Change lanes of their own accord (traffic_manager, sumo).
    lane_changes: null
    # Probabilities (0-1) of ignoring lights, signs, vehicles and
    # walkers, and of a random lane change (traffic_manager only).
    ignore_lights: null
    ignore_signs: null
    ignore_vehicles: null
    ignore_walkers: null
    random_lane_changes: null
    # Acceleration and braking, m/s^2, reaction time, s, and driver
    # imperfection, 0-1 (sumo only).
    accel: null
    decel: null
    reaction_time_s: null
    imperfection: null
    # Hold the traffic to the speed it stops from within what its
    # drivers see in the run's weather (sumo only; on by default there).
    follow_visibility: null
  # SUMO's pedestrians (sumo only: the TrafficManager drives no pedestrians).
  pedestrians:
    # Walking speed, m/s, and its spread between people (speedDev).
    walking_speed_mps: null
    speed_deviation: null
    # Gap kept to the person ahead, m.
    min_gap_m: null
    # Walk onto a crossing whose light has been red for less than this, s.
    red_light_violation_s: null
