# @package _global_
# Logical: every left turn of the map, one concrete scenario each.
#
#   scenario-expand scenario=intersection_passing/left_turn map=<map>
#
# The values outside `sweep:` are what a run without expanding uses: the fixed
# Nishi-Shinjuku case. Every lanelet value is replaced per case.
scenario:
  name: intersection_passing
  expected_route_lanelet_ids: [411, 207]
  # A swept case may turn at a stop sign, where the ego waits before it goes.
  timeout_seconds: 20.0
  turn_direction: left

ego:
  initial_speed_kmh: 20.0
  spawn_lanelet_id: 203
  spawn_s: 25.0

sweep:
  constraints:
    # The left turns of the map: junction lanelets whose turn_direction says so.
    # Nothing names an intersection, so the same file expands on any map.
    ego.spawn_lanelet_id:
      - type: and
        constraints:
          - type: turn_direction
            value: left
          # A stop line at its start, to measure the spawn from.
          - type: has_stop_line
          - type: not
            constraint:
              type: in_set
              values: ${map.no_3d_model_lanelet_ids}
  bindings:
    # A junction lanelet's stop line sits at its start, so 25 m before it
    # falls on the lane that approaches the junction, where the run starts;
    # the spawn lanelet moves with it.
    ego.spawn_s:
      type: stop_line_offset
      offset: 25.0
    # The junction lanelet, then the lane it comes out on: what the run asserts
    # on, and where an ego that plans for itself is sent.
    scenario.expected_route_lanelet_ids:
      type: route_through
      depth: 1
