# @package _global_
# Logical: every stop line of the map that no traffic light governs (a stop
# sign's), one concrete scenario each.
#
#   scenario-expand scenario=temporary_stop/temporary_stop map=<map>
#
# The values outside `sweep:` are what a run without expanding uses: the fixed
# Nishi-Shinjuku case. Every lanelet value is replaced per case.
scenario:
  name: temporary_stop
  s_margin: 5.0
  speed_threshold: 0.1
  stop_duration: 0.3
  restart_speed_kmh: 3.0
  # From a standstill 15 m short of the line, as a swept case starts: about
  # 5 s to reach it, the stop, and the restart.
  timeout_seconds: 12.0

ego:
  initial_speed_kmh: 0.0
  spawn_lanelet_id: 285
  # 15 m short of the stop line at the start of lanelet 299, where the
  # sweep's stop_line_offset puts this case.
  spawn_s: 38.07
  # Past the stop line this run is about, and on up the road.
  goal_lanelet_id: 132

sweep:
  constraints:
    ego.spawn_lanelet_id:
      - type: and
        constraints:
          # A lane before it, which stop_line_offset walks back onto where the
          # line is nearer its lanelet's start than 15 m (#2350). The binding
          # drops a pick whose road behind the line runs out short of 15 m
          # (#2392), so every case starts 15 m before the line. A
          # lanelet_length of 0 m or more is any lanelet.
          - type: following_of
            constraints:
              - type: lanelet_length
                value: 0.0
          - type: has_stop_line
          - type: not
            constraint:
              type: has_traffic_light_stop_line
          - type: not
            constraint:
              type: in_set
              values: ${map.no_3d_model_lanelet_ids}
  bindings:
    # 15 m short of the stop line, walking back onto the lane before where the
    # line is nearer its lanelet's start than that; a pick with less than
    # 15 m of road behind the line is dropped.
    ego.spawn_s:
      type: stop_line_offset
      offset: 15.0
    # Past the stop line: the lane after the one it is on.
    ego.goal_lanelet_id:
      type: route_through
      depth: 1
      last_only: true
  # The constraints see the pick, not the lane stop_line_offset walks the
  # spawn back onto or the goal past the line: keep both off the lanelets
  # CARLA does not draw.
  exclude:
    ego.spawn_lanelet_id: ${map.no_3d_model_lanelet_ids}
    ego.goal_lanelet_id: ${map.no_3d_model_lanelet_ids}
