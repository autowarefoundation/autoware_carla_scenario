# @package _global_
# Logical: a pedestrian runs out in front of the ego, on every lane at the
# kerb of the map's roads, one concrete scenario each.
#
#   scenario-expand scenario=pedestrian_dart_out/pedestrian_dart_out map=<map>
#
# The values outside `sweep:` are what a run without expanding uses: a fixed
# Nishi-Shinjuku case. The lanelet is replaced per case.
scenario:
  name: pedestrian_dart_out
  # At the kerb 35 m ahead, half a lane and a bit off the lane's centre. The
  # kerb side follows the road's traffic rule (the OpenDRIVE road's `rule`):
  # the right in right-hand traffic, the left in left-hand traffic.
  pedestrian_ahead_m: 35.0
  pedestrian_offset_m: 3.0
  # Runs out at 2 m/s once the ego is within 20 m.
  trigger_distance_m: 20.0
  walk_speed_ms: 2.0
  pass_beyond_m: 10.0
  timeout_seconds: 25.0

# Lanelet 19: the kerb lane of its road (Nishi-Shinjuku drives on the left,
# and 19 has no lane on its left). Its neighbour 20 is the lane by the centre
# line, with the oncoming lanelet 28 on its right.
ego:
  initial_speed_kmh: 30.0
  spawn_lanelet_id: 19
  spawn_s: 5.0

# What this scenario's parameters set, by scenario measure (measures.py), for
# a sweep that draws them from an ODD (sweep.odd_sample, docs/odd.md). The
# pedestrian sets off when the ego is trigger_distance_m away -- the gap the
# built-in crossing_pedestrian_gap_m first reads (a little less, as it stands
# off to the side) -- and runs at walk_speed_ms. The ranges are what the
# scenario can stage: it stands pedestrian_ahead_m ahead, so it cannot set off
# further away than that.
controls:
  crossing_pedestrian_gap_m:
    key: scenario.trigger_distance_m
    range: [8.0, 30.0]
  crossing_pedestrian_speed_ms:
    key: scenario.walk_speed_ms
    range: [0.8, 3.0]

sweep:
  constraints:
    ego.spawn_lanelet_id:
      - type: and
        constraints:
          # The lane at the kerb: no lane on its kerb side, so the
          # pedestrian steps straight off the kerb into it. The constraint
          # cannot read the map's traffic rule, so the side is set for the
          # default map, Nishi-Shinjuku, which drives on the left: `left`.
          # On a right-hand-traffic map (Town10HD_Opt) it is `right`: sweep
          # a copy of this file with `value: right` (a command-line override
          # cannot reach it, as the key `ego.spawn_lanelet_id` has a dot).
          - type: not
            constraint:
              type: has_adjacent
              value: left
          - type: not
            constraint:
              type: is_junction
          # The spawn, 35 m to the pedestrian, 10 m past it, and a margin.
          - type: lanelet_length
            rule: greater_than_or_equal
            value: 55.0
          - type: not
            constraint:
              type: in_set
              values: ${map.no_3d_model_lanelet_ids}
