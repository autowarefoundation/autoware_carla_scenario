# @package _global_
# Logical: a vehicle in the lane on the ego's left cuts in just ahead of it,
# on every lane of the map with a lane on its left, one concrete scenario each.
#
#   scenario-expand scenario=cut_in/left map=<map>
#
# The values outside `sweep:` are what a run without expanding uses: a fixed
# Nishi-Shinjuku case. The lanelets are replaced per case.
scenario:
  name: cut_in
  side: left
  npc_lanelet_id: 19
  # 10 m ahead in the next lane, both at 30 km/h; it changes lanes after 2 s.
  # npc_ahead_m is along the NPC's lanelet (its s less the ego's); npc_gap_m,
  # when set, is the gap vehicle_ahead_gap_m reads at the start instead, and
  # the NPC's s is solved for so it does, however the lanelets curve.
  npc_ahead_m: 10.0
  npc_gap_m: null
  npc_initial_speed_kmh: 30.0
  cut_in_after_seconds: 2.0
  hold_seconds: 3.0
  timeout_seconds: 20.0
  # Fail when the ego leaves the lanes ahead of it -- its spawn lanelet and
  # the lanelets that follow it, up to lanes_ahead_m from the start of the
  # spawn lanelet -- for leaving_lane_seconds: a lane change, a turn onto a
  # lanelet that does not follow it, or leaving the road. The position is the vehicle's centre.
  fail_on_leaving_lane: true
  lanes_ahead_m: 1000.0
  leaving_lane_seconds: 0.2
  # Fail on any collision of the ego; false fails only on one with the NPC.
  fail_on_any_collision: true

ego:
  initial_speed_kmh: 30.0
  spawn_lanelet_id: 20
  spawn_s: 5.0

# What this scenario's parameters set, by scenario measure (measures.py), for
# a sweep that draws them from an ODD (sweep.odd_sample, docs/odd.md). The
# gap is drawn as the measure itself (target: measure): npc_gap_m is the gap
# the built-in vehicle_ahead_gap_m reads at the start, and the scenario solves
# the NPC's placement for it, so it is exact wherever the case is placed. The
# relative speed is a raw setting, exact by definition: both start along their
# lanes at their speeds, and the measure is the NPC's speed along the ego's
# heading less the ego's. The ranges are what the scenario can stage: a
# vehicle closer than 6 m overlaps the ego's at spawn. Which ODD attribute
# these are is the ODD's to say, by mapping its taxonomy onto the measures.
controls:
  vehicle_ahead_gap_m:
    key: scenario.npc_gap_m
    target: measure
    range: [6.0, 30.0]
  vehicle_ahead_relative_speed_kph:
    key: scenario.npc_initial_speed_kmh
    offset: ${ego.initial_speed_kmh}
    range: [-15.0, 15.0]
    # A speed, whatever the ego's: a slow ego leaves the slower leads out.
    limits: [0.0, null]

sweep:
  constraints:
    ego.spawn_lanelet_id:
      - type: and
        constraints:
          # A lane on the left a vehicle may change in from.
          - type: has_adjacent
            value: left
          - type: not
            constraint:
              type: is_junction
          # The spawn, the NPC 10 m ahead, and room for the cut-in.
          - type: lanelet_length
            rule: greater_than_or_equal
            value: 60.0
          - type: not
            constraint:
              type: in_set
              values: ${map.no_3d_model_lanelet_ids}
  bindings:
    # The NPC starts on that lane, beside the ego's.
    scenario.npc_lanelet_id:
      type: adjacent
      side: left
