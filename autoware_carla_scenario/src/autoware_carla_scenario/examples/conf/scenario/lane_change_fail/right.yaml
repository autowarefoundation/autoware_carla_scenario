# @package _global_
scenario:
  name: lane_change
  direction: right
  expect: fail
  # As long as lane_change/*'s window for the change: the run passes once it
  # has run out with the ego still in its own lane (#2253).
  timeout_seconds: 10.0

ego:
  # Driving, as the ego of a lane change would be: refused at 1 km/h, no
  # change could have happened anyway.
  initial_speed_kmh: 20.0
  spawn_lanelet_id: 5
  # Off the lanelet's start, which can sit on the seam between two
  # OpenDRIVE roads and resolve to the one the ego is not on.
  spawn_s: 5.0
  # Up the road from the spawn; every swept case replaces it.
  goal_lanelet_id: 119

sweep:
  constraints:
    ego.spawn_lanelet_id:
      - type: and
        constraints:
          - type: not
            constraint:
              type: has_adjacent
              value: right
          - type: lanelet_length
            rule: greater_than_or_equal
            value: 10.0
          - type: not
            constraint:
              type: is_junction
          - type: not
            constraint:
              type: in_set
              values: ${map.no_3d_model_lanelet_ids}
          # Nor one whose goal would be such a lanelet: the lane after it, or
          # the lane out of the junction it leads into.
          - type: not
            constraint:
              type: previous_of
              constraints:
                - type: in_set
                  values: ${map.no_3d_model_lanelet_ids}
          - type: not
            constraint:
              type: previous_of
              constraints:
                - type: and
                  constraints:
                    - type: is_junction
                    - type: previous_of
                      constraints:
                        - type: in_set
                          values: ${map.no_3d_model_lanelet_ids}
  bindings:
    # Up the road from the pick: the lane after it, or past the junction it
    # leads into, so the goal never sits inside one.
    ego.goal_lanelet_id:
      type: route_through
      depth: 1
      through_junction: true
      last_only: true
