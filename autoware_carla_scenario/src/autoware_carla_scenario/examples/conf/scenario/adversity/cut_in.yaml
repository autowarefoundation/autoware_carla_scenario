# @package _global_
# An NPC 6 m ahead in the lane on the ego's left (lanelet 324 beside 446)
# changes in front of the ego, close behind it there: a cut-in
# (AdversarialCutInAction). Placed on Town10HD_Opt:
#
#   scenario scenario=adversity/cut_in map=town10hd_opt
scenario:
  name: adversity
  kind: cut_in
  npc_lanelet_id: 324
  npc_ahead_m: 6.0
  npc_speed_kmh: 30.0
  timeout_seconds: 30.0
  # The rest are AdversityConfig's defaults, listed so that a
  # scenario.<key>= override finds them (#1317).
  npc_offset_m: -3.0
  npc_vehicle_type: vehicle.mini.cooper
  walker_type: walker.pedestrian.0015
  ego_speed_kmh: null
  red_light: false
  # nade only.
  nade_seconds: 45.0
  nade_probability: 0.05
  nade_is_probability: 0.5
  nade_cooldown: 2.0
  nade_challenge_npcs: true
  nade_seed: 7

ego:
  initial_speed_kmh: 30.0
  spawn_lanelet_id: 446
  spawn_s: 5.0
