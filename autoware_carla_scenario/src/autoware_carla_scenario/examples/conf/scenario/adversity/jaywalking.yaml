# @package _global_
# A pedestrian at the kerb 35 m ahead of the ego, off any crosswalk, walks
# across the road: jaywalking (JaywalkAction). Placed on Town10HD_Opt:
#
#   scenario scenario=adversity/jaywalking map=town10hd_opt
#
# The lanelet ids are Town10HD_Opt's, so give map=town10hd_opt: this file
# cannot select the map group itself (Hydra refuses an `override /map` from
# the scenario group, which config.yaml composes before `map`), and on the
# default nishishinjuku map the ids name other lanelets or none.
scenario:
  name: adversity
  kind: jaywalking
  npc_lanelet_id: 324
  npc_ahead_m: 35.0
  npc_offset_m: -3.0
  timeout_seconds: 30.0
  # The rest are AdversityConfig's defaults, listed so that a
  # scenario.<key>= override finds them (#1317).
  npc_speed_kmh: 30.0
  npc_vehicle_type: vehicle.mini.cooper
  walker_type: walker.pedestrian.0015
  ego_speed_kmh: null
  red_light: false
  # nade only.
  nade_seconds: 45.0
  nade_probability: 0.05
  nade_is_probability: 0.5
  nade_cooldown: 2.0
  nade_challenge_npcs: true
  nade_seed: null

ego:
  initial_speed_kmh: 15.0
  spawn_lanelet_id: 324
  spawn_s: 5.0
