# @package _global_
scenario:
  name: lane_change
  direction: left
  expect: success
  timeout_seconds: 10.0

ego:
  initial_speed_kmh: 1.0
  spawn_lanelet_id: 183
  # Off the lanelet's start, which can sit on the seam between two
  # OpenDRIVE roads and resolve to the one the ego is not on.
  spawn_s: 5.0
  # Up the road from the spawn; every swept case replaces it.
  goal_lanelet_id: 141

sweep:
  constraints:
    ego.spawn_lanelet_id:
      - type: and
        constraints:
          - type: has_adjacent
            value: left
          # Long enough to finish the change before the road ends: the pass
          # condition looks for the target lane only up to the next junction.
          - type: lanelet_length
            rule: greater_than_or_equal
            value: 30.0
          - type: not
            constraint:
              type: is_junction
          - type: not
            constraint:
              type: in_set
              values: ${map.no_3d_model_lanelet_ids}
          # Nor one whose goal would be such a lanelet: the lane after it, or
          # the lane out of the junction it leads into.
          - type: not
            constraint:
              type: previous_of
              constraints:
                - type: in_set
                  values: ${map.no_3d_model_lanelet_ids}
          - type: not
            constraint:
              type: previous_of
              constraints:
                - type: and
                  constraints:
                    - type: is_junction
                    - type: previous_of
                      constraints:
                        - type: in_set
                          values: ${map.no_3d_model_lanelet_ids}
  bindings:
    # Up the road from the pick: the lane after it, or past the junction it
    # leads into, so the goal never sits inside one.
    ego.goal_lanelet_id:
      type: route_through
      depth: 1
      through_junction: true
      last_only: true
