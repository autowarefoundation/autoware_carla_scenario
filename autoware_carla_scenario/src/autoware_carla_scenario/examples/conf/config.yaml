defaults:
  - _self_
  - server: localhost
  - ego: default
  - entity: default
  - driver: default
  - traffic_manager: default
  - traffic: traffic_manager
  - scenario: intersection_passing/left_turn
  - map: nishishinjuku

# The ODD every run is measured against (docs/odd.md): "default", a name
# registered with register_odd() or an entry point, an OpenODD YAML file
# (odd=path/to/odd.yaml), or package.module:function.  Its attributes are the
# ODD coverage in {Scenario}_coverage.json; its modules say which ticks were
# outside it.
odd: default

# Compile the scenario with Codon before it runs, and refuse it if it does not
# type-check (docs/typecheck.md): auto (when Codon is installed), required, off.
typecheck: auto

server:
  host: localhost
  port: 2000

traffic_manager:
  port: 8100

map:
  name: ???
  # A git repository holding the HD map, e.g.
  #   map.source=git+https://huggingface.co/datasets/OWNER/NAME@REF#PATH
  # Declared here so Hydra's struct mode accepts it as an override; see
  # autoware_carla_scenario.maps for what it resolves to.
  source: null
  # A map directory on this machine, read in place instead of a repository:
  #   map.directory=/path/to/autoware_maps/Town10HD_Opt
  directory: null
  xodr_path: null
  lanelet2_path: null
  no_3d_model_lanelet_ids: []

# Autoware as the ego (ego.entity=autoware; docs/autoware.md).
autoware:
  # The bridge server Autoware's scenario_bridge node dials for the mission.
  address: localhost:50052
  # Ticks Autoware has to localize, route and engage once it reached the bridge.
  ready_timeout_ticks: 1200
  # Wall-clock seconds a launched stack has to reach the bridge.
  boot_timeout_s: 300.0
  # Who starts Autoware for each scenario, and removes it after:
  #   none    - someone else does (launched by hand, or Autoware launches the
  #             scenario through with_scenario)
  #   docker  - a local Autoware workspace, built and run in its dev container
  #   command - `command` below, run on this host
  # A fresh Autoware per scenario is what lets a batch or a sweep run scenario
  # after scenario:
  #   uv run scenario 'scenario=intersection_passing/*' ego.entity=autoware \
  #     autoware.launcher.type=docker autoware.launcher.workspace=$HOME/autoware \
  #     'autoware.launcher.launch=[autoware_launch,e2e_simulator.launch.xml,"bridge_address:={bridge_address}",...]'
  launcher:
    type: none
    # docker: a clone of autowarefoundation/autoware with its sources in src/.
    workspace: ~/autoware
    # The .devcontainer/ variant whose image and workspace mount are used.
    devcontainer: universe-devel-cuda
    image: null
    workspace_mount: null
    # auto (when install/ is missing) | always | never
    build: auto
    colcon_args: [--symlink-install, --cmake-args, -DCMAKE_BUILD_TYPE=Release]
    # ros2 launch <package> <file> <name:=value>...; {bridge_address} is the
    # bridge's address, to be handed to scenario_bridge.
    launch: []
    mounts:
      ~/autoware_data: /home/aw/autoware_data
    env: {}
    ros_domain_ids: []
    gpus: all
    user: null
    docker_args: []
    # command: the command line, with {bridge_address}, {index} and {name}.
    command: []
    stop_timeout_s: 20.0

ego:
  vehicle_type: vehicle.mini.cooper
  initial_speed_kmh: 0.0
  spawn_lanelet_id: 242
  spawn_s: 25.0
  # Where the ego is going; each scenario names it, or derives it in setup().
  goal_lanelet_id: null
  goal_s: 0.0
  # autopilot | autoware | carla_driver
  entity: autopilot

# Background traffic: vehicles no scenario entity stands for, placed and
# removed by TrafficSourceAction / TrafficSinkAction through the traffic
# backend (SUMO's own traffic under traffic=sumo, autopilot cars under
# traffic=traffic_manager). Off unless a run asks for it:
#
#   uv run scenario ... traffic=sumo background_traffic.enabled=true
#
# Where vehicles appear and disappear is given as lanelet constraints, the
# vocabulary a sweep uses, so the same settings fit any map.
background_traffic:
  enabled: false
  seed: 0
  source:
    constraints:
      - type: not
        constraint:
          type: is_junction
      - type: lanelet_length
        rule: greater_than_or_equal
        value: 20.0
    # Placed during initialization, before the run starts.
    initial_vehicles: 20
    # Then added while the run lasts; 0 keeps it to the initial ones.
    vehicles_per_minute: 6.0
    # Stop adding after this many seconds of the run; null to keep going.
    stop_after_seconds: null
    # The most background vehicles on the road at once.
    max_vehicles: 30
    # The speed they drive at, at most.
    speed_kmh: 30.0
    min_gap_m: 20.0
    blueprint: null
  sink:
    # Where they are removed; null for no sink. Lanelets with no successor --
    # the ends of the map's roads -- by default.
    constraints:
      - type: not
        constraint:
          type: previous_of
          constraints:
            - type: lanelet_length
              rule: greater_than_or_equal
              value: 0.0
    stop_after_seconds: null

# What the scenario's parameters set, by ODD attribute: how a sweep's
# odd_sample (docs/odd.md) draws them from the ODD. A scenario declares its
# own; the ODD never names a scenario, and a control the ODD has no attribute
# for is left alone. The weather and the sun (`environment` below) are
# controlled for every scenario already.
#
#   controls:
#     dynamic.vehicle_ahead_gap: {key: scenario.npc_ahead_m, range: [6, 30]}
controls: {}

# The weather and the sun every run starts in (EnvironmentAction, during
# initialization); null leaves the world's own. A sweep's odd_sample draws
# these from the ODD (docs/odd.md), as can a single run:
#
#   uv run scenario ... environment.precipitation=80 environment.sun_altitude_angle=-10
environment:
  cloudiness: null
  precipitation: null
  precipitation_deposits: null
  wetness: null
  wind_intensity: null
  fog_density: null
  fog_distance: null
  sun_altitude_angle: null
  sun_azimuth_angle: null

entity:
  ground_projection_ray_distance_upper: 5.0
  ground_projection_ray_distance_lower: 10.0
  spawn_retry_max_count: 10
  spawn_retry_t_step: 0.1
  spawn_retry_z_step: 0.5
