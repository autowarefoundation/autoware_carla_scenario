repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # The vendored alpasim protos are copied verbatim from upstream (see
      # autoware_carla_scenario/proto/README.md) and the modules under _proto/ are
      # protoc output checked byte-for-byte by test_proto_generated.py. Reformatting
      # either would break that guarantee.
      - id: trailing-whitespace
        exclude: '^autoware_carla_scenario/proto/'
      - id: end-of-file-fixer
        exclude: '^autoware_carla_scenario/proto/'
      - id: check-yaml
        exclude: 'mkdocs\.yml$'
      - id: check-added-large-files
        exclude: '\.(osm|xodr|png|whl|mp4)$'
      - id: check-merge-conflict
      - id: check-toml
      - id: debug-statements
      - id: mixed-line-ending

  # - repo: https://github.com/psf/black
  #   rev: 24.10.0
  #   hooks:
  #     - id: black
  #       language_version: python3.10

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        args:
          - --ignore-missing-imports
          - autoware_carla_scenario/src
          - autoware_carla_scenario/test
        pass_filenames: false
        # Not `always_run`: a commit that touches no Python and no
        # configuration cannot change mypy's verdict.
        files: '(\.pyi?|^pyproject\.toml|^uv\.lock)$'

  # There is no pytest hook. The fast suite compiles ~260 scenarios with
  # Codon (~13 s each), and their cached verdicts are keyed by the whole
  # package's source (typecheck/check.py's _python_digest), so any commit that
  # touched the package recompiled every one of them: minutes per commit. The
  # CI `test` jobs run the suite on every pull request; run it locally with
  # `uv run pytest` (see CLAUDE.md).
