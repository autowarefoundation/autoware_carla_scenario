[project]
name = "autoware-carla-scenario-t4"
version = "0.1.0"
description = "Write T4 driving scenes down as autoware_carla_scenario scenarios"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Masaya Kataoka", email = "ms.kataoka@gmail.com" }
]
# The framework's range: this package is used beside it.
requires-python = ">=3.10,<3.15"
dependencies = [
    # The trajectory model, the scenario document and the Lanelet2 loading
    # the documents are placed with.
    "autoware-carla-scenario",
    "numpy>=1.21",
    # A T4 scene's `derived/frames.pack` (the per-frame object boxes) is
    # zstd-compressed frame by frame.
    "zstandard>=0.23",
]

[project.scripts]
t4-scenario = "autoware_carla_scenario_t4.cli:main"

[tool.uv.sources]
autoware-carla-scenario = { workspace = true }

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"
