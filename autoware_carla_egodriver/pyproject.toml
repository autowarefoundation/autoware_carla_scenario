[project]
name = "autoware-carla-egodriver"
version = "0.1.0"
description = "Both ends of alpasim's egodriver gRPC contract: serve a driving policy, or drive one without CARLA"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Masaya Kataoka", email = "ms.kataoka@gmail.com" }
]
# Matches autoware-carla-scenario: Autoware's own environment is 3.10, which
# alpasim's published `alpasim-grpc` excludes -- hence the vendored protos.
requires-python = ">=3.10,<3.15"
# Deliberately light, so a policy can depend on it without the scenario
# framework: the wire format (grpcio, and protobuf from the 4.25 the generated
# modules were built with), arrays, rotations, and image decoding.
dependencies = [
    "grpcio>=1.60",
    # 4.25 gencode, which every runtime from 4.25 through 7.x loads; the 4.x
    # runtime cannot load on Python 3.14 (see autoware-carla-scenario).
    "protobuf>=4.25.0,<8",
    "numpy>=1.21",
    # Rotations (Rotation, Slerp) for the geometry module.
    "scipy>=1.8",
    "pillow>=10.0",
]

[project.scripts]
autoware-carla-egodriver = "autoware_carla_egodriver.cli:main"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"
