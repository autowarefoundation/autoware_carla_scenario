# The CARLA simulator this policy is driven against.
#
#   docker compose up -d carla                    # start the server
#   uv run stl-driver serve --port 50051 &        # start the policy
#   uv run --extra carla carla-driver-interface run \
#       --carla-host localhost --map Town10HD_Opt --traffic 30 \
#       --driver localhost:50051 --steps 400
#   docker compose down
#
# The tag is 0.9.16 rather than the 0.9.15 used elsewhere on this host, and it
# has to be: `carla_driver_interface` requires Python 3.11-3.12, and 0.9.16 is
# the only CARLA release publishing a client wheel for those versions. Server
# and client must match.
#
# NOTE (this host): the NVIDIA userspace GL/Vulkan libraries lag the kernel
# driver, which breaks on-screen GPU rendering inside containers. Hence
# -RenderOffScreen. If Vulkan fails entirely, `-nullrhi` is a viable fallback
# *for this policy specifically* -- it never reads a camera, so losing sensor
# rendering costs it nothing.

services:
  carla:
    image: carlasim/carla:0.9.16
    command: ./CarlaUE4.sh -RenderOffScreen -carla-rpc-port=2000 -quality-level=Epic
    ports:
      - "2000-2002:2000-2002"   # RPC + streaming
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    # CARLA needs a decent amount of shared memory for the renderer.
    shm_size: "2gb"
