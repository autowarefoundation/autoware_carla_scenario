# Deploys the documentation to GitHub Pages with mike, outside of a release.
#
# The release workflow publishes each release's docs as `X.Y.Z` and moves
# `latest` to it. Until the first release, and between releases, that leaves
# Pages empty or behind master, so this workflow keeps two things up to date:
#
#   push to master     The docs as they stand on master, as the version `dev`.
#                      While no release has published `latest`, `dev` is also
#                      made the default, so the site is never a 404.
#   workflow_dispatch  With a `version`, publish the selected ref's docs as that
#                      version -- for a version whose release never deployed
#                      its docs (3.1.2, the last release before the move to
#                      autowarefoundation, is one). The ref's package version
#                      must match. As in the release workflow, `latest` (and
#                      the site root) moves to it only when it is the version
#                      master is at; an older version is published beside the
#                      others and `latest` stays. Without a `version`, the same
#                      as a push, and dispatched from master only: from any
#                      other ref it fails rather than publish that ref as `dev`.
#
# Pages must be set, once, to deploy from the `gh-pages` branch (Settings ->
# Pages -> Build and deployment -> Deploy from a branch). This workflow creates
# that branch on its first run.

name: Docs

on:
  push:
    branches: [master]
    paths:
      - "autoware_carla_scenario/docs/**"
      - "autoware_carla_scenario/mkdocs.yml"
      # Fills in typecheck.md's library-check counts and lists (#789).
      - "autoware_carla_scenario/mkdocs_hooks/**"
      - "autoware_carla_scenario/overrides/**"
      # The typecheck_library.py hook fills typecheck.md from the sources:
      # typecheck/library.py's entries, each module's line count and its
      # docstring's first paragraph (typecheck/library_docs.py).
      - "autoware_carla_scenario/src/**"
      - ".github/actions/build-docs/**"
      - ".github/scripts/publish-docs.sh"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
    inputs:
      version:
        description: >
          Publish the selected ref's docs as this version (e.g. 3.1.2); it
          becomes `latest` only if it is the version master is at. Leave empty
          to deploy master's docs as `dev` (run from master only).
        required: false
        type: string
        default: ""

permissions:
  contents: write

# mike commits to gh-pages; two deploys racing would have one rejected.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy the documentation
    runs-on: ubuntu-24.04
    env:
      REQUESTED: ${{ inputs.version }}
      CONFIG: autoware_carla_scenario/mkdocs.yml
    steps:
      - uses: actions/checkout@v4
        with:
          # The git-revision-date plugin reads each page's history.
          fetch-depth: 0

      - name: resolve the version to deploy
        id: v
        run: |
          set -euo pipefail
          pkg=$(sed -n 's/^version = "\(.*\)"/\1/p' autoware_carla_scenario/pyproject.toml)
          if [ -z "${REQUESTED}" ]; then
            # `dev` is master's docs. A push runs on master only; a dispatch
            # from a feature branch or an old tag without a `version` would
            # overwrite the public `dev` docs with that ref's (#2302).
            if [ "${GITHUB_REF}" != "refs/heads/master" ]; then
              # Not "give the version this ref carries": a feature branch
              # carries master's version, and would then become `latest`.
              echo "::error::Without a version this deploys master's docs as dev; run it from master, or from a release's v<version> tag with that version (${GITHUB_REF_NAME} is not master)"
              exit 1
            fi
            echo "version=dev" >> "$GITHUB_OUTPUT"
            echo "mode=dev" >> "$GITHUB_OUTPUT"
            echo "Deploying ${GITHUB_REF_NAME} (package ${pkg}) as dev"
            exit 0
          fi
          version="${REQUESTED#v}"
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'${REQUESTED}' is not a version like 3.1.2"
            exit 1
          fi
          if [ "${pkg}" != "${version}" ]; then
            echo "::error::${GITHUB_REF_NAME} carries version ${pkg}, not ${version}; run this from the v${version} tag or its release commit"
            exit 1
          fi
          # Only the version master is at becomes "latest", as in the release
          # workflow: backfilling an older release's docs must not move
          # `latest` and the site root back to it.
          git fetch --quiet origin "+refs/heads/master:refs/remotes/origin/master"
          master=$(git show origin/master:autoware_carla_scenario/pyproject.toml \
            | sed -n 's/^version = "\(.*\)"/\1/p')
          if [ "${master}" = "${version}" ]; then
            mode=latest
          else
            mode=older
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          echo "Deploying ${GITHUB_REF_NAME} as ${version} (${mode}; master is at ${master})"

      - name: Setup environment
        uses: ./.github/actions/setup-env
        with:
          install-dev-deps: "true"

      # Builds once to fail early, before mike's own build below.
      - name: Build carla-scenario documentation
        uses: ./.github/actions/build-docs
        with:
          package-dir: autoware_carla_scenario

      - name: Deploy to GitHub Pages with mike
        env:
          VERSION: ${{ steps.v.outputs.version }}
          MODE: ${{ steps.v.outputs.mode }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Retries a push the Release workflow raced, and prunes the release
          # docs that no longer fit on Pages (see the script).
          if [ "${MODE}" = "dev" ]; then
            .github/scripts/publish-docs.sh dev
          else
            .github/scripts/publish-docs.sh "${MODE}" "${VERSION}"
          fi
