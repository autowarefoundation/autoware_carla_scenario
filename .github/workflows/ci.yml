name: CI

on:
  pull_request:
    branches: [ master, main, develop ]
  # Master once ran the test matrices on every merge, about 500 runner-minutes
  # each, to repeat verdicts its pull request already had (#457). They run once
  # a night instead, and on demand.
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

# A new push to a pull request makes its running CI moot: cancel it rather than
# let it hold runners that the organisation's other runs are queued behind.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The nightly run on master runs only the fast test matrices, on every
# interpreter of the range where a pull request runs only the floor and the
# ceiling, and the Codon checks on each of them. The other jobs run on pull
# requests only: on master they would repeat the pull request's verdict.
#
# The Codon checks (`-m codon`, some 1,240 tests at ~11 s a compile) are nine
# tenths of the fast suite. A pull request runs them in one leg per
# architecture (`codon: true`): 3.10 on x86_64, 3.14 on aarch64. Its other
# legs run the rest of the suite. Each Codon leg runs as two shards, two jobs
# side by side (`shard: 1/2` and `2/2`): the conftest hashes a test's node id
# into one of them (AUTOWARE_CARLA_SCENARIO_TEST_SHARD), so the two run every
# test of the leg once between them, the non-Codon ones included. The nightly
# run shards the same two legs and runs the others whole.
#
# Of the Codon checks, those marked `codon_selftest` test the checker itself on
# code of their own (test_typecheck_codon.py and the others, and the shim and
# driver tests of test_typecheck_library.py): a pull request runs them only
# when it changes something they read (.github/actions/codon-selftests lists
# what), and every other event runs them. The compile checks of the package's
# own code -- the library check, the built-in scenarios, the template, a
# scaffolded package -- run on every pull request.
#
# A Codon verdict is cached under a key of everything the compile reads
# (typecheck/check.py's _cache_key), the whole package source included: a pull
# request that changes the package's source compiles everything again, and one
# that does not reuses the verdicts of the nightly run or of its own previous
# push.

jobs:
  test:
    # The whole supported range (`requires-python`) on master. The floor is
    # 3.10 because that is what Autoware's own environment is. A pull request
    # runs the floor and the ceiling, which stand in for the interpreters
    # between them; master catches what only those break.
    name: test (${{ matrix.python-version }}${{ matrix.shard != '1/1' && format(', codon {0}', matrix.shard) || '' }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Kept literal: test_authoring_export.py checks it against
        # TESTED_PYTHONS and `requires-python`.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # The share of the leg's tests a job runs (`K/N`). Every leg is one
        # shard but 3.10's, which the exclude drops and the include brings
        # back as two.
        shard: ["1/1"]
        exclude: ${{ fromJSON(github.event_name == 'pull_request' && '[{"python-version":"3.10"}, {"python-version":"3.11"}, {"python-version":"3.12"}, {"python-version":"3.13"}]' || '[{"python-version":"3.10"}]') }}
        include:
          - python-version: "3.10"
            shard: "1/2"
            codon: true
          - python-version: "3.10"
            shard: "2/2"
            codon: true
    env:
      CODON: ${{ matrix.codon || github.event_name != 'pull_request' }}

    steps:
    - uses: actions/checkout@v4
      with:
        # The merge commit and its parents: codon-selftests diffs the pull
        # request's merge against its base.
        fetch-depth: 2

    - name: Setup environment
      uses: ./.github/actions/setup-env
      with:
        python-version: ${{ matrix.python-version }}
        install-dev-deps: "true"
        run-precommit: "false"

    - name: Decide whether to run the Codon checker's self-tests
      if: env.CODON == 'true'
      uses: ./.github/actions/codon-selftests

    # The slow tests are the 'slow-tests' job below: they export a package and
    # build a ~160 MB wheelhouse over the network, which is not something to do
    # in every leg of this matrix.
    # Each shard keeps a cache of its own: a shard compiles only its share, and
    # the prune below would drop the other shard's verdicts from a shared one.
    - name: Restore the Codon check verdicts
      if: env.CODON == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/typecheck-cache
        key: typecheck-${{ runner.arch }}-${{ matrix.python-version }}-${{ matrix.shard }}-${{ github.sha }}
        restore-keys: typecheck-${{ runner.arch }}-${{ matrix.python-version }}-${{ matrix.shard }}-

    # -n logical: one worker a vCPU. `auto` counts physical cores, two on the
    # x86_64 runner (four vCPUs), so the Codon leg ran on half the machine.
    # worksteal: the Codon compiles take ~11 s a test, and with the default
    # 'load' scheduling the last of them ran one after another on a single
    # worker while the others sat idle. An idle worker now takes over another
    # worker's queue.
    # The library compile builds every checked module at once and is the
    # largest Codon process of the suite. Run beside the other workers' Codon
    # compiles it outgrew the arm64 runner, which was shut down at ~94 %
    # every time, so it runs alone first (in the shard it hashes into) and the
    # rest runs in parallel.
    # pytest exits 5 when it selects nothing, which a shard's share of a
    # selection may be: that, and only that, passes.
    - name: Run tests
      env:
        AUTOWARE_CARLA_SCENARIO_TYPECHECK_CACHE: ${{ runner.temp }}/typecheck-cache
        AUTOWARE_CARLA_SCENARIO_TEST_SHARD: ${{ matrix.shard }}
        LIBRARY_COMPILE: autoware_carla_scenario/test/carla_scenario/test_typecheck_library.py::test_the_checked_modules_compile
      run: |
        pytest_shard() {
          local status=0
          uv run pytest -v --tb=short -o addopts= "$@" || status=$?
          if [ "${status}" -eq 5 ]; then
            echo "Nothing of this selection is in shard ${AUTOWARE_CARLA_SCENARIO_TEST_SHARD}."
            status=0
          fi
          return "${status}"
        }
        if [ "${CODON}" != "true" ]; then
          markers="not slow and not codon"
        elif [ "${CODON_SELFTEST}" = "true" ]; then
          markers="not slow"
        else
          markers="not slow and not codon_selftest"
        fi
        touch "${RUNNER_TEMP}/typecheck-started"
        if [ "${CODON}" = "true" ]; then
          pytest_shard "${LIBRARY_COMPILE}"
        fi
        pytest_shard -n logical --dist worksteal -m "${markers}" \
          --deselect "${LIBRARY_COMPILE}"

    # A verdict this run did not read or write is for sources that no longer
    # exist: drop it rather than carry it into every later cache. Only after a
    # run of every Codon test of the shard: one without the self-tests would
    # drop their verdicts.
    - name: Prune the Codon check verdicts this run did not use
      if: env.CODON == 'true' && env.CODON_SELFTEST == 'true'
      run: |
        find "${RUNNER_TEMP}/typecheck-cache" -type f \
          ! -newer "${RUNNER_TEMP}/typecheck-started" -delete 2>/dev/null || true

  slow-tests:
    # What the fast matrix leaves out: a real export, a real wheelhouse, and a
    # real 'pip install --no-index' of it. One leg is enough: the wheelhouse is
    # built for every interpreter in TESTED_PYTHONS whatever the exporting one
    # is, and the test installs it under each of them. What does follow the
    # exporting interpreter is the exported package's .python-version (so the
    # Python its own tests run on); test-arm64 exports from the floor and the
    # ceiling, this leg from the middle.
    name: slow tests (3.12)
    runs-on: ubuntu-24.04
    # Repeats the pull request's verdict and seeds no cache: see the top.
    if: github.event_name == 'pull_request'

    steps:
    - uses: actions/checkout@v4

    - name: Setup environment
      uses: ./.github/actions/setup-env
      with:
        python-version: "3.12"
        install-dev-deps: "true"
        run-precommit: "false"

    - name: Run the slow tests
      run: uv run pytest -v --tb=short -o addopts= -m slow

  test-arm64:
    # Linux aarch64, natively. Every runtime dependency ships an aarch64 wheel
    # (typesafe-carla and its Codon toolchain since 0.4.0); of the dev group,
    # libsass (under mkdocs-with-pdf) does not and is compiled from its sdist
    # with the runner's g++ (setup-env caches the wheel it builds). Otherwise
    # this is the same suite as on x86_64, fast and slow tests both -- a
    # wheelhouse is built for the exporting machine's platform. The floor and
    # the ceiling of the range stand in for the interpreters between them. The
    # Codon leg runs as two shards, as the 'test' job's does.
    name: test (${{ matrix.python-version }}, arm64${{ matrix.shard != '1/1' && format(', codon {0}', matrix.shard) || '' }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
        shard: ["1/1"]
        exclude:
          - python-version: "3.14"
        include:
          - python-version: "3.14"
            shard: "1/2"
            codon: true
          - python-version: "3.14"
            shard: "2/2"
            codon: true
    env:
      CODON: ${{ matrix.codon || github.event_name != 'pull_request' }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2  # See the 'test' job.

    - name: Setup environment
      uses: ./.github/actions/setup-env
      with:
        python-version: ${{ matrix.python-version }}
        install-dev-deps: "true"
        run-precommit: "false"

    - name: Decide whether to run the Codon checker's self-tests
      if: env.CODON == 'true'
      uses: ./.github/actions/codon-selftests

    # As in the 'test' job.
    - name: Restore the Codon check verdicts
      if: env.CODON == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/typecheck-cache
        key: typecheck-${{ runner.arch }}-${{ matrix.python-version }}-${{ matrix.shard }}-${{ github.sha }}
        restore-keys: typecheck-${{ runner.arch }}-${{ matrix.python-version }}-${{ matrix.shard }}-

    # As in the 'test' job, which says why the library compile runs alone.
    - name: Run tests
      env:
        AUTOWARE_CARLA_SCENARIO_TYPECHECK_CACHE: ${{ runner.temp }}/typecheck-cache
        AUTOWARE_CARLA_SCENARIO_TEST_SHARD: ${{ matrix.shard }}
        LIBRARY_COMPILE: autoware_carla_scenario/test/carla_scenario/test_typecheck_library.py::test_the_checked_modules_compile
      run: |
        pytest_shard() {
          local status=0
          uv run pytest -v --tb=short -o addopts= "$@" || status=$?
          if [ "${status}" -eq 5 ]; then
            echo "Nothing of this selection is in shard ${AUTOWARE_CARLA_SCENARIO_TEST_SHARD}."
            status=0
          fi
          return "${status}"
        }
        if [ "${CODON}" != "true" ]; then
          markers="not slow and not codon"
        elif [ "${CODON_SELFTEST}" = "true" ]; then
          markers="not slow"
        else
          markers="not slow and not codon_selftest"
        fi
        touch "${RUNNER_TEMP}/typecheck-started"
        if [ "${CODON}" = "true" ]; then
          pytest_shard "${LIBRARY_COMPILE}"
        fi
        pytest_shard -n logical --dist worksteal -m "${markers}" \
          --deselect "${LIBRARY_COMPILE}"

    # As in the 'test' job.
    - name: Prune the Codon check verdicts this run did not use
      if: env.CODON == 'true' && env.CODON_SELFTEST == 'true'
      run: |
        find "${RUNNER_TEMP}/typecheck-cache" -type f \
          ! -newer "${RUNNER_TEMP}/typecheck-started" -delete 2>/dev/null || true

    # Repeats the pull request's verdict and seeds no cache: see the top. A
    # sharded leg runs its share of them.
    - name: Run the slow tests
      if: github.event_name == 'pull_request'
      env:
        AUTOWARE_CARLA_SCENARIO_TEST_SHARD: ${{ matrix.shard }}
      run: |
        status=0
        uv run pytest -v --tb=short -o addopts= -m slow || status=$?
        if [ "${status}" -eq 5 ]; then
          echo "No slow test is in shard ${AUTOWARE_CARLA_SCENARIO_TEST_SHARD}."
          status=0
        fi
        exit "${status}"

  build:
    # The package builds to 'py3-none-any' with uv_build, so the artifact
    # does not depend on the interpreter. Building it in every matrix leg
    # reported one break as three red jobs.
    name: build the package
    runs-on: ubuntu-24.04
    # Repeats the pull request's verdict and seeds no cache: see the top.
    if: github.event_name == 'pull_request'
    steps:
    - uses: actions/checkout@v4

    - name: Setup environment
      uses: ./.github/actions/setup-env
      with:
        install-dev-deps: "true"
        run-precommit: "false"

    - name: Check package can be built
      run: uv build --package autoware-carla-scenario

  lint-and-format:
    runs-on: ubuntu-24.04
    # Repeats the pull request's verdict and seeds no cache: see the top.
    if: github.event_name == 'pull_request'
    steps:
    - uses: actions/checkout@v4

    - name: Setup environment
      uses: ./.github/actions/setup-env
      with:
        install-dev-deps: "true"
        run-precommit: "true"
        precommit-continue-on-error: "false"

  auto-format:
    name: Auto-fix formatting
    runs-on: ubuntu-24.04
    needs: lint-and-format
    if: |
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup environment
        uses: ./.github/actions/setup-env
        with:
          install-dev-deps: "true"
          run-precommit: "false"

      - name: Run pre-commit auto-fix
        run: uv run pre-commit run --all-files || true

      - name: Commit and push if changes were made
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: auto-fix formatting with pre-commit"
          git push

  docs:
    runs-on: ubuntu-24.04
    # Repeats the pull request's verdict and seeds no cache: see the top. The
    # Docs workflow builds and deploys master's documentation.
    if: github.event_name == 'pull_request'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup environment
      uses: ./.github/actions/setup-env
      with:
        install-dev-deps: "true"
        run-precommit: "false"

    - name: Build carla-scenario documentation
      uses: ./.github/actions/build-docs
      with:
        package-dir: autoware_carla_scenario
        config-file: mkdocs.ci.yml
        strict: "true"

    - name: Upload carla-scenario documentation artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: documentation-carla-scenario
        path: autoware_carla_scenario/site/
        retention-days: 7

  scenario-image:
    # Proves the packing action end-to-end: scaffold a scenario package the way
    # a user would, pack it, and let the action's smoke test confirm that the
    # image really carries the prebuilt CARLA client and a registered scenario.
    #
    # Once per architecture, each natively: the action builds for the runner's
    # own platform. The x86_64 leg keeps the job's original name.
    name: scenario image${{ matrix.arch == 'arm64' && ' (arm64)' || '' }}
    runs-on: ${{ matrix.runner }}
    # Repeats the pull request's verdict: see the top. A run on master would
    # leave a build cache for pull requests to restore, but not one worth two
    # Docker builds on every merge.
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64

    steps:
    - uses: actions/checkout@v4

    - name: Setup environment
      uses: ./.github/actions/setup-env
      with:
        install-dev-deps: "true"
        # The job only runs one console script; the dev group (mkdocs,
        # weasyprint, mypy, ...) would be installed and never touched.
        sync-dev-group: "false"
        run-precommit: "false"

    - name: Scaffold a scenario package
      run: uv run scenario-new ci_probe_package --output-dir "${RUNNER_TEMP}/packages"

    - name: Pack it into an image
      uses: ./.github/actions/pack-scenario-image
      id: pack
      with:
        scenario-package-path: ${{ runner.temp }}/packages/ci_probe_package
        image: ci-probe-scenario
        push: "false"

    - name: Report the image size
      run: |
        docker image ls --format \
          '### Scenario image `{{ .Repository }}:{{ .Tag }}` — {{ .Size }}' \
          "${{ steps.pack.outputs.image-ref }}" | tee -a "${GITHUB_STEP_SUMMARY}"

    # The image is split into four layers so that a second scenario built on
    # the same client and framework re-downloads only its own. Prove it on a
    # second package: if a scenario ever leaks into one of the shared layers,
    # every consumer starts pulling the whole virtualenv again, and nothing
    # else in this suite would notice.
    - name: Scaffold a second scenario package
      run: uv run scenario-new ci_probe_variant --output-dir "${RUNNER_TEMP}/packages"

    - name: Pack the second package
      uses: ./.github/actions/pack-scenario-image
      id: pack-variant
      with:
        scenario-package-path: ${{ runner.temp }}/packages/ci_probe_variant
        image: ci-probe-scenario-variant
        push: "false"
        # The first image already proved the runtime works; this one is here
        # for its layers.
        smoke-test: "false"
        # Everything but the scenario layer is the same build as the first
        # pack, so read its cache rather than resolving and installing the
        # ~400 MB dependency closure a second time.
        cache-scope: ${{ steps.pack.outputs.cache-scope }}

    - name: Check the two images share everything but the scenario layer
      env:
        FIRST: ${{ steps.pack.outputs.image-ref }}
        SECOND: ${{ steps.pack-variant.outputs.image-ref }}
      run: |
        python3 - <<'PY' | tee -a "${GITHUB_STEP_SUMMARY}"
        import json
        import os
        import subprocess


        def layers(ref: str) -> list[str]:
            out = subprocess.run(
                ["docker", "image", "inspect", "--format", "{{json .RootFS.Layers}}", ref],
                capture_output=True, text=True, check=True,
            ).stdout
            return json.loads(out)


        first, second = layers(os.environ["FIRST"]), layers(os.environ["SECOND"])

        # Everything up to and including the framework layer has to match. The
        # two that may differ are the scenario layer -- which is the point --
        # and the `useradd` layer behind it, whose files carry the time the
        # build ran.
        assert first[:-2] == second[:-2], (
            "the client, dependency or framework layer now depends on the "
            f"scenario package: {first} vs {second}"
        )
        print(f"### Layer sharing — {len(first) - 2} of {len(first)} layers identical")
        PY
