name: Release

on:
  push:
    branches:
      - master
  # Finishes the release of a version a labelled merge already bumped to, for
  # when a later step failed (the tag push, the Release, the docs) --
  # re-running that push run would bump a second time from the old merge
  # commit. It builds from that version's tag, or else from its
  # "chore: bump version to X" commit on master, never from master's HEAD, so
  # a merge that landed since cannot leak into it. Every step below is safe to
  # repeat: an existing tag, Release or asset is reused.
  workflow_dispatch:
    inputs:
      version:
        description: Version to finish releasing, e.g. 2.63.0
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    # A manual release only ever comes from master.
    if: github.event_name == 'push' || github.ref == 'refs/heads/master'
    outputs:
      bump_type: ${{ steps.pr-labels.outputs.bump_type }}
      new_version: ${{ steps.version.outputs.version }}
      # Read by the `pypi-*` jobs below: whether this run releases, and the
      # commit the release was cut from.
      release: ${{ steps.version.outputs.release }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # GH_PAT, when the repository has one, lets `git push origin master`
          # (version-bump commit) and `git push origin v<version>` (release
          # tag) satisfy a master branch ruleset whose bypass list does not
          # include github-actions[bot] (direct pushes are then rejected with
          # GH013). Without the secret, GITHUB_TOKEN is used -- an empty token
          # would fail the checkout itself.
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup base environment
        uses: ./.github/actions/setup-env
        with:
          install-dev-deps: "false"

      - name: Get merged PR labels
        if: github.event_name == 'push'
        id: pr-labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha
            });

            // Find the merged PR
            const mergedPR = prs.find(pr => pr.merged_at !== null);

            if (!mergedPR) {
              console.log('No merged PR found for this commit');
              core.setOutput('bump_type', 'none');
              return;
            }

            console.log(`Found merged PR #${mergedPR.number}`);

            const labels = mergedPR.labels.map(label => label.name);
            console.log(`PR labels: ${labels.join(', ')}`);

            // Store PR information
            core.setOutput('pr_number', mergedPR.number);
            core.setOutput('pr_title', mergedPR.title);
            core.setOutput('pr_url', mergedPR.html_url);
            core.setOutput('pr_author', mergedPR.user.login);

            // Check for version bump labels
            let bumpType = 'none';
            if (labels.includes('bump major')) {
              bumpType = 'major';
            } else if (labels.includes('bump minor')) {
              bumpType = 'minor';
            } else if (labels.includes('bump patch')) {
              bumpType = 'patch';
            }

            core.setOutput('bump_type', bumpType);

      - name: Bump version
        if: github.event_name == 'push' && steps.pr-labels.outputs.bump_type != 'none'
        id: bump-version
        run: |
          bump_type="${{ steps.pr-labels.outputs.bump_type }}"

          # Extract current version from autoware_carla_scenario/pyproject.toml
          current_version=$(grep '^version = ' autoware_carla_scenario/pyproject.toml | sed 's/version = "\(.*\)"/\1/' || true)

          # Validate version extraction
          if [ -z "$current_version" ]; then
            echo "ERROR: Could not extract version from pyproject.toml"
            exit 1
          fi

          echo "Current version: $current_version"

          # Parse version components
          IFS='.' read -r major minor patch <<< "$current_version"

          # Bump version based on label
          case "$bump_type" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac

          new_version="${major}.${minor}.${patch}"
          echo "New version: $new_version"

          # Update autoware_carla_scenario/pyproject.toml
          sed -i "s/^version = \".*\"/version = \"$new_version\"/" autoware_carla_scenario/pyproject.toml

          # Keep uv.lock in sync with the bumped version. The editable package
          # entry in uv.lock records the version, so bumping pyproject.toml
          # without re-locking leaves uv.lock stale and makes every subsequent
          # non-frozen uv command (uv lock / uv sync / uv pip install) rewrite
          # the lockfile. `uv lock` keeps every other pin as it is.
          uv lock

          # Set outputs
          echo "new_version=${new_version}" >> "$GITHUB_OUTPUT"
          echo "bump_type=${bump_type}" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        if: github.event_name == 'push' && steps.pr-labels.outputs.bump_type != 'none'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add autoware_carla_scenario/pyproject.toml uv.lock
          git commit -m "chore: bump version to ${{ steps.bump-version.outputs.new_version }}"
          git push origin master

      - name: Resolve the version to release
        id: version
        env:
          EVENT: ${{ github.event_name }}
          BUMP_TYPE: ${{ steps.pr-labels.outputs.bump_type }}
          BUMPED: ${{ steps.bump-version.outputs.new_version }}
          REQUESTED: ${{ inputs.version }}
        run: |
          read_version() {
            git show "$1:autoware_carla_scenario/pyproject.toml" \
              | sed -n 's/^version = "\(.*\)"/\1/p'
          }

          if [ "${EVENT}" = "workflow_dispatch" ]; then
            version="${REQUESTED#v}"
            if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "ERROR: '${REQUESTED}' is not a version like 2.63.0"
              exit 1
            fi
            git fetch --tags --quiet origin
            if git rev-parse --verify --quiet "refs/tags/v${version}" > /dev/null; then
              sha=$(git rev-list -n 1 "v${version}")
            else
              sha=$(git log origin/master -1 --format=%H \
                --grep="^chore: bump version to ${version//./\\.}\$")
            fi
            if [ -z "${sha}" ]; then
              echo "ERROR: no v${version} tag and no 'chore: bump version to ${version}' commit on master"
              exit 1
            fi
            if [ "$(read_version "${sha}")" != "${version}" ]; then
              echo "ERROR: ${sha} does not carry version ${version}"
              exit 1
            fi
            # Build the docs from the release commit, not from master.
            git checkout --quiet --detach "${sha}"
          elif [ "${BUMP_TYPE}" != "none" ]; then
            version="${BUMPED}"
            sha=$(git rev-parse HEAD)
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Only the version master is at becomes "latest": finishing an older
          # release must not move the latest Release or the latest docs back.
          if [ "$(read_version origin/master)" = "${version}" ]; then
            latest=true
          else
            latest=false
          fi

          echo "Releasing v${version} from ${sha} (latest: ${latest})"
          {
            echo "version=${version}"
            echo "sha=${sha}"
            echo "latest=${latest}"
            echo "release=true"
          } >> "$GITHUB_OUTPUT"

      - name: Create Git tag
        if: steps.version.outputs.release == 'true'
        env:
          TAG: v${{ steps.version.outputs.version }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null; then
            echo "${TAG} already exists; not moving it."
            exit 0
          fi
          git tag "${TAG}" "${SHA}"
          git push origin "${TAG}"

      - name: Create GitHub Release
        if: steps.version.outputs.release == 'true'
        uses: actions/github-script@v7
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
          LATEST: ${{ steps.version.outputs.latest }}
          BUMP_TYPE: ${{ steps.pr-labels.outputs.bump_type }}
          PR_NUMBER: ${{ steps.pr-labels.outputs.pr_number }}
          PR_TITLE: ${{ steps.pr-labels.outputs.pr_title }}
          PR_URL: ${{ steps.pr-labels.outputs.pr_url }}
          PR_AUTHOR: ${{ steps.pr-labels.outputs.pr_author }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = `v${process.env.NEW_VERSION}`;

            try {
              const { data: existing } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              console.log(`Release already exists: ${existing.html_url}`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            // A labelled merge links its PR; a manual release lets GitHub list
            // what changed since the previous tag.
            const fromPR = Boolean(process.env.PR_NUMBER);
            const releaseBody = fromPR
              ? [
                  `## What's Changed`,
                  ``,
                  `- ${process.env.PR_TITLE} (#${process.env.PR_NUMBER}) by @${process.env.PR_AUTHOR}`,
                  ``,
                  `**Full Changelog**: ${process.env.PR_URL}`,
                  ``,
                  `---`,
                  ``,
                  `This release was created by automated workflow (bump ${process.env.BUMP_TYPE}).`,
                ].join('\n')
              : 'This release was created by a manual run of the release workflow.';

            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Release ${tag}`,
              body: releaseBody,
              generate_release_notes: !fromPR,
              make_latest: process.env.LATEST === 'true' ? 'true' : 'false',
              draft: false,
              prerelease: false,
            });
            console.log(`Created release: ${release.html_url}`);

      - name: Setup full environment
        if: steps.version.outputs.release == 'true'
        uses: ./.github/actions/setup-env
        with:
          install-dev-deps: "true"

      - name: Build carla-scenario documentation with PDF
        if: steps.version.outputs.release == 'true'
        uses: ./.github/actions/build-docs
        with:
          package-dir: autoware_carla_scenario
          version: ${{ steps.version.outputs.version }}
          enable-pdf: "true"
          pdf-output-path: carla-scenario-documentation-v${{ steps.version.outputs.version }}.pdf

      - name: Create documentation archive
        if: steps.version.outputs.release == 'true'
        run: |
          cd autoware_carla_scenario/site
          zip -r ../../carla-scenario-documentation-v${{ steps.version.outputs.version }}.zip .
          cd ../..

      - name: Upload documentation to release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        # --clobber replaces an asset a previous attempt already uploaded.
        run: |
          gh release upload "v${VERSION}" --clobber \
            "carla-scenario-documentation-v${VERSION}.zip" \
            "carla-scenario-documentation-v${VERSION}.pdf"

      - name: Deploy to GitHub Pages with mike
        if: steps.version.outputs.release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch gh-pages branch
          git fetch origin gh-pages --depth=1 || true

          if [ "${{ steps.version.outputs.latest }}" = "true" ]; then
            uv run mike deploy --push --update-aliases --config-file autoware_carla_scenario/mkdocs.yml ${{ steps.version.outputs.version }} latest

            # Set latest as default version
            uv run mike set-default --push --config-file autoware_carla_scenario/mkdocs.yml latest
          else
            # An older release: publish its docs without moving "latest".
            uv run mike deploy --push --config-file autoware_carla_scenario/mkdocs.yml ${{ steps.version.outputs.version }}
          fi

      - name: No version bump needed
        if: steps.version.outputs.release != 'true'
        run: |
          echo "No version bump label found. Skipping release."

  # Builds the release commit's wheel and sdist and proves the wheel installs on
  # every interpreter the package supports. The package is pure Python
  # (`py3-none-any`), so one wheel serves them all -- which is exactly what this
  # checks, against each interpreter's own resolution of the dependencies.
  pypi-build:
    name: build the distributions
    needs: release
    if: needs.release.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}

      - uses: astral-sh/setup-uv@v5

      - name: Check the package version matches the release
        env:
          VERSION: ${{ needs.release.outputs.new_version }}
        run: |
          pkg=$(sed -n 's/^version = "\(.*\)"/\1/p' autoware_carla_scenario/pyproject.toml)
          echo "release=${VERSION} pyproject=${pkg}"
          test "${pkg}" = "${VERSION}"

      - name: Build the wheel and sdist
        run: uv build --package autoware-carla-scenario --out-dir dist

      # PyPI rejects an upload whose metadata it cannot render or that names a
      # file the archive does not carry, and it does so after the OIDC exchange
      # -- so the same check runs here first, where failing costs nothing.
      - name: Check the metadata
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: dist
          if-no-files-found: error

  pypi-install:
    name: install on Python ${{ matrix.python-version }}
    needs: pypi-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The whole of `requires-python`, as CI's test matrix.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: astral-sh/setup-uv@v5

      - uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist

      # From PyPI's dependencies alone, with the `sumo` extra, the way a user
      # installs it -- not from this repository's lock.
      - name: Install the wheel into a clean environment
        run: |
          uv venv --python "${{ matrix.python-version }}" "${RUNNER_TEMP}/fresh"
          uv pip install --python "${RUNNER_TEMP}/fresh" "$(ls dist/*.whl)[sumo]"

      - name: Import it and run its console scripts
        run: |
          "${RUNNER_TEMP}/fresh/bin/python" - <<'PY'
          import importlib.metadata as metadata
          import sys

          import autoware_carla_scenario

          print(sys.version)
          print("autoware-carla-scenario", metadata.version("autoware-carla-scenario"))
          PY
          "${RUNNER_TEMP}/fresh/bin/scenario-new" --help > /dev/null

  # Trusted Publishing: no API token is stored in this repository. Configure it
  # once on PyPI -- Publishing -> add a (pending) publisher with owner
  # `autowarefoundation`, repository `autoware_carla_scenario`, workflow
  # `release.yml`, environment `pypi` -- and create the `pypi` environment in
  # this repository's settings. Until then this job fails and the
  # distributions remain available as the `pypi-dist` artifact.
  pypi-publish:
    name: publish to PyPI
    needs: [release, pypi-build, pypi-install]
    if: needs.release.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/autoware-carla-scenario
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist

      # PyPI never replaces a file, so skipping what is already there makes a
      # manual re-run of a release (workflow_dispatch) upload only what an
      # earlier attempt did not.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
