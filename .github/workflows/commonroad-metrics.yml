name: commonroad_metrics

# commonroad_metrics/ is a project of its own (its own lock, not a workspace
# member: CommonRoad pins protobuf 3 and builds for CPython 3.10-3.11 only),
# so it is tested on its own, and only when it, or the workflow, changes.
on:
  push:
    branches: [ master, main, develop ]
    paths:
      - "commonroad_metrics/**"
      - ".github/workflows/commonroad-metrics.yml"
  pull_request:
    branches: [ master, main, develop ]
    paths:
      - "commonroad_metrics/**"
      - ".github/workflows/commonroad-metrics.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # The floor and the ceiling of `requires-python`.
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    defaults:
      run:
        working-directory: commonroad_metrics
    env:
      # uv fetches the interpreter itself.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
        enable-cache: true
        cache-dependency-glob: "commonroad_metrics/uv.lock"
        cache-suffix: commonroad-metrics-${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --locked

    - name: Run the tests
      run: uv run pytest -v --tb=short
