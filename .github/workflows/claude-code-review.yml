name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The action fails the job outright when it has no credentials, so a
      # repository that has not configured the token gets a red X on every
      # pull request for a review that never ran. `secrets` is not available
      # in an `if:`, so its presence is carried through an output instead.
      - name: Check for a Claude Code token
        id: token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: echo "present=${CLAUDE_CODE_OAUTH_TOKEN:+yes}" >> "${GITHUB_OUTPUT}"

      - name: "Skipped: no Claude Code token configured"
        if: steps.token.outputs.present != 'yes'
        run: |
          echo "CLAUDE_CODE_OAUTH_TOKEN is not set, so the review did not run." \
            >> "${GITHUB_STEP_SUMMARY}"
          echo "Set it with 'gh secret set CLAUDE_CODE_OAUTH_TOKEN' to enable it." \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: Run Claude Code Review
        id: claude-review
        if: steps.token.outputs.present == 'yes'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
