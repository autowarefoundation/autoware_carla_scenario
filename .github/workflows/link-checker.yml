name: Link Checker

on:
  # Run on pull requests
  pull_request:
    branches: [master, main, develop]
  # Run weekly on Sundays at 00:00 UTC
  schedule:
    - cron: '0 0 * * 0'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  link-checker:
    name: Check Links
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Run lychee link checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Check all markdown, Python, YAML, TOML, and HTML files. The
          # excluded paths and URLs live in lychee.toml (read from the working
          # directory), not here, so they are in one place.
          args: >
            --cache
            --max-cache-age 1d
            --verbose
            --no-progress
            --
            '**/*.md'
            '**/*.py'
            '**/*.yml'
            '**/*.yaml'
            '**/*.toml'
            '**/*.html'
          # Don't fail the workflow, just report issues
          fail: false
          # Use markdown format for better readability
          format: markdown
          # Generate job summary
          jobSummary: true
          # Output results to file
          output: lychee-report.md

      - name: Display link checker results
        if: always()
        run: |
          echo "Link checker completed with exit code: ${{ steps.lychee.outputs.exit_code }}"
          if [ -f lychee-report.md ]; then
            echo "Link checker report:"
            cat lychee-report.md
          fi

      # A weekly run updates the report issue that is still open rather than
      # opening another one every week.
      - name: Find an open broken-links issue (scheduled runs only)
        id: open-issue
        if: |
          github.event_name == 'schedule' &&
          steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 'Link Checker Report: Broken Links Found'
        run: |
          set -euo pipefail
          number=$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open \
            --search "\"${TITLE}\" in:title" --json number,title --limit 100 \
            | jq -r --arg title "${TITLE}" \
                '[.[] | select(.title == $title) | .number] | sort | first // empty')
          echo "number=${number}" >> "$GITHUB_OUTPUT"
          if [ -n "${number}" ]; then
            echo "Updating the open issue #${number}"
          fi

      - name: Create or update issue for broken links (scheduled runs only)
        if: |
          github.event_name == 'schedule' &&
          steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: 'Link Checker Report: Broken Links Found'
          content-filepath: lychee-report.md
          labels: bug, documentation, automated issue
          # Empty: a new issue is created.
          issue-number: ${{ steps.open-issue.outputs.number }}

      - name: Upload link checker report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: lychee-report.md
          retention-days: 30

      - name: Summary
        if: always()
        env:
          EXIT_CODE: ${{ steps.lychee.outputs.exit_code }}
        run: |
          # Empty when the lychee step did not get as far as reporting one.
          if [ -z "$EXIT_CODE" ]; then
            echo "⚠️ The link checker did not report an exit code; see its step above."
          elif [ "$EXIT_CODE" -eq 0 ]; then
            echo "✅ All links are valid!"
          else
            echo "⚠️ Some links may be broken. Please check the report above."
            echo "Exit code: $EXIT_CODE"
          fi
