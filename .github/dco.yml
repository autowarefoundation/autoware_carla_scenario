# Configuration for the DCO GitHub App (https://github.com/dcoapp/app).
#
# A commit pushed without a Signed-off-by line can be fixed by a remediation
# commit instead of rewriting history: this repository forbids force pushes
# (CLAUDE.md, "Git Operation Restrictions"), which is the only other fix.
# See CLAUDE.md, "DCO Sign-off", for the commit format.
allowRemediationCommits:
  # The author of the unsigned commit adds their own sign-off.
  individual: true
