# Lychee Link Checker Configuration
# Documentation: https://lychee.cli.rs/guides/config/

# Cache configuration
cache = true
max_cache_age = "1d"

# Request configuration
max_redirects = 10
max_retries = 3
timeout = 20

# User agent string
user_agent = "Mozilla/5.0 (compatible; Lychee/0.21.0; +https://github.com/lycheeverse/lychee)"

# HTTP method to use for checking links
method = "get"

# Accept invalid SSL certificates (use with caution)
insecure = false

# Check links inside HTML comments
include_verbatim = false

# Exclude URLs matching these patterns (in addition to .lycheeignore)
exclude = [
    # Local file links
    "^file://",
]

# Include only these schemes
scheme = [
    "https",
    "http",
]

# Which files are checked is given by the inputs (link-checker.yml); `include`
# would be a list of URL regexes, not file globs.

# Exclude these paths from checking
exclude_path = [
    ".git",
    "node_modules",
    "__pycache__",
    ".venv",
    "venv",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "build",
    "dist",
    # The viewer's and the editor's Jinja templates: their root-relative links
    # are the web app's routes (`/maps`, `/static/editor.css`), not files.
    "autoware_carla_scenario/src/autoware_carla_scenario/editor/templates",
    "autoware_carla_scenario/src/autoware_carla_scenario/ui/templates",
    # The test suites: their URLs are fixtures (repositories, map URLs, proxies
    # and origins that exist nowhere), parsed and never fetched. lychee reads
    # these values as regular expressions over the input's path.
    "autoware_carla_scenario/test/",
    "commonroad_metrics/tests/",
    "stl_driver/tests/",
    "examples/scenario_package_template/tests/",
]

# GitHub token (set via environment variable GITHUB_TOKEN)
# This is automatically available in GitHub Actions
# github_token = ""

# Verbose output
verbose = "info"

# Don't show progress bar (better for CI)
no_progress = true
