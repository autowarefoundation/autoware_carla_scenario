[tool.uv.workspace]
members = [
    "autoware_carla_scenario",
]
# The STL policy, a simulated ego for tuning scenarios (stl_driver/README.md).
# A project of its own, with its own lock, rather than a member: a virtual root
# syncs every member, so a member's torch would reach every `uv sync` and
# `uv run`. Add it to the framework's environment when wanted:
# `uv run --with-editable ./stl_driver ...`.
exclude = [
    "stl_driver",
]

[tool.uv.sources]
# The T4 dataset reader the tests load each written dataset with, at its
# latest release (it is not on PyPI under this name).
t4-devkit = { git = "https://github.com/tier4/t4-devkit", tag = "v0.8.0" }

[dependency-groups]
dev = [
    "black>=25.11.0",
    # Regenerates the vendored alpasim protobuf modules; must stay on the protobuf 4.x
    # line so the generated code matches the pinned runtime. That line has no wheels
    # for 3.13+ and no longer builds there, so regenerate on 3.10-3.12; the runtime
    # never needs it.
    "grpcio-tools>=1.60,<1.63; python_version < '3.13'",
    # Required by starlette.testclient, which the Scenario Editor route tests
    # drive the app through.
    "httpx2>=2.12.0",
    "lark>=1.3.1",
    "mike>=2.1.3",
    "mkdocs>=1.6.0",
    "mkdocs-git-revision-date-localized-plugin>=1.5.1",
    "mkdocs-material>=9.5.0",
    "mkdocs-with-pdf>=0.9.3",
    "mkdocstrings[python]>=0.27.0",
    "mypy>=1.19.0",
    "pre-commit>=4.5.0",
    "pytest>=9.0.3",
    "pytest-testmon>=2.2.0",
    "pytest-xdist>=3.8.0",
    # The SUMO traffic backend and its tests (the `sumo` extra).
    "eclipse-sumo>=1.23",
    "libsumo>=1.23",
    "sumolib>=1.23",
    "traci>=1.23",
    # ...and the `map` extra (driver map files) and its tests.
    "roadgen>=0.41.2",
    # ...and the `ros2` extra (the DDS ego) and its tests, where it has wheels.
    "cyclonedds>=11.0.1; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version < '3.14'",
    # `ui/scanner.py` and `test_driver_config.py` read YAML, and without these
    # stubs mypy reports both as untyped imports.
    "types-pyyaml>=6.0.12.20260815",
    "weasyprint>=68.0",
    # ...and the `hils` extra (the HILS bridge) and its tests.
    "hilspy>=0.16,<0.17",
    # ...and the `rerun` extra (Rerun recordings of the runs) and its tests.
    "autoware-carla-scenario-rerun>=0.1,<0.2",
    "hypothesis>=6.100",
    "jsonschema>=4.18",
    # ...and the `t4` extra (T4 datasets of the runs) and its tests, which
    # read every dataset back with t4-devkit, TIER IV's own reader. It
    # supports Python 3.10-3.12, and its sanity checker imports colorama
    # without declaring it.
    "autoware-carla-scenario-t4>=0.1,<0.2",
    "t4-devkit>=0.8.0,<0.9; python_version < '3.13'",
    "colorama>=0.4.6; python_version < '3.13'",
]

[tool.ruff]
# Generated protobuf modules are verbatim protoc output, regenerated by
# autoware_carla_scenario/scripts/compile_protos.py.  Match the `_proto` package
# convention so every generated group is covered without per-group config churn.
extend-exclude = ["**/_proto"]
# The floor of requires-python; keeps newer-only syntax from passing locally.
target-version = "py310"

[tool.ruff.lint]
# mypy cannot be pinned to python_version = "3.10" (numpy's stubs use 3.12
# `type` statements), so names missing on 3.10 are banned here instead.
extend-select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Self".msg = "Missing on Python 3.10; use typing_extensions."
"typing.assert_never".msg = "Missing on Python 3.10; use typing_extensions."
"typing.override".msg = "Missing on Python 3.10; use typing_extensions."
"typing.LiteralString".msg = "Missing on Python 3.10; use typing_extensions."
"typing.Never".msg = "Missing on Python 3.10; use typing_extensions."
"typing.NotRequired".msg = "Missing on Python 3.10; use typing_extensions."
"typing.Required".msg = "Missing on Python 3.10; use typing_extensions."
"typing.Unpack".msg = "Missing on Python 3.10; use typing_extensions."
"typing.TypeVarTuple".msg = "Missing on Python 3.10; use typing_extensions."
"datetime.UTC".msg = "Missing on Python 3.10; use datetime.timezone.utc."
"enum.StrEnum".msg = "Missing on Python 3.10."
"asyncio.TaskGroup".msg = "Missing on Python 3.10."

[tool.mypy]
ignore_missing_imports = true
exclude = [
    "conftest\\.py$",
    ".*/_proto/",
]

[[tool.mypy.overrides]]
# Generated protobuf modules carry no useful annotations of their own.
module = ["autoware_carla_scenario.*._proto.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# Cyclone DDS's IDL annotations (`array[float64, 36]`, `sequence[T]`) are read
# by cyclonedds at run time; its type stubs do not take type arguments.
module = ["autoware_carla_scenario.ros2.messages"]
disable_error_code = ["type-arg", "valid-type", "assignment"]

[tool.pytest.ini_options]
testpaths = [
    "autoware_carla_scenario/test",
]
# testmon is opt-in (`uv run pytest --testmon`): it never re-selects tests that
# depend on the set of files or on docs text, which CI (no testmon) runs.
addopts = "-n auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring a running CARLA server",
    "codon: marks tests that compile with Codon (CI runs them in one leg per architecture)",
]
