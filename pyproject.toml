[tool.uv]
find-links = ["carla_wheels"]

[tool.uv.workspace]
members = [
    "autoware_carla_scenario",
]

[dependency-groups]
dev = [
    "black>=25.11.0",
    "filelock>=3.13.0",
    # Regenerates the vendored alpasim protobuf modules; must stay on the protobuf 4.x
    # line so the generated code matches the pinned runtime.
    "grpcio-tools>=1.60,<1.63",
    # Required by starlette.testclient, which the Scenario Editor route tests
    # drive the app through.
    "httpx2>=2.12.0",
    "lark>=1.3.1",
    "mike>=2.1.3",
    "mkdocs>=1.6.0",
    "mkdocs-git-revision-date-localized-plugin>=1.5.1",
    "mkdocs-material>=9.5.0",
    "mkdocs-with-pdf>=0.9.3",
    "mkdocstrings[python]>=0.27.0",
    "mypy>=1.19.0",
    "pre-commit>=4.5.0",
    "pytest>=9.0.3",
    "pytest-testmon>=2.2.0",
    "pytest-xdist>=3.8.0",
    # `ui/scanner.py` and `test_driver_config.py` read YAML, and without these
    # stubs mypy reports both as untyped imports.
    "types-pyyaml>=6.0.12.20260815",
    "weasyprint>=68.0",
]

[tool.ruff]
# Generated protobuf modules are verbatim protoc output, regenerated by
# autoware_carla_scenario/scripts/compile_protos.py.  Match the `_proto` package
# convention so every generated group is covered without per-group config churn.
extend-exclude = ["**/_proto"]

[tool.mypy]
ignore_missing_imports = true
exclude = [
    "conftest\\.py$",
    ".*/_proto/",
]

[[tool.mypy.overrides]]
# Generated protobuf modules carry no useful annotations of their own.
module = ["autoware_carla_scenario.*._proto.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = [
    "autoware_carla_scenario/test",
]
addopts = "-n auto --testmon"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring a running CARLA server",
]
